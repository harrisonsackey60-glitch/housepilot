<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142a24"><title>HousePilot</title>
<style>
:root{--g:#176b4b;--ink:#182923;--muted:#66756d;--line:#dce5df;--bg:#f3f6f4}*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:650}.primary{background:var(--g);color:white}.secondary{background:#e4f2ea;color:var(--g)}header{background:#142a24;color:white;padding:17px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800}.brand small{display:block;font-size:10px;letter-spacing:2px}.wrap{max-width:1000px;margin:auto;padding:15px}.notice{padding:12px;background:#fff5d7;border:1px solid #eadba6;border-radius:10px;font-size:13px;margin-bottom:14px}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0 16px}.tab{white-space:nowrap;background:white;border:1px solid var(--line)}.tab.active{background:var(--g);color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}.muted{font-size:13px;color:var(--muted)}.metric{font-size:24px;font-weight:800;margin-top:6px}h1{font-size:25px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;background:white}.full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.empty{text-align:center;padding:22px;color:var(--muted)}.pill{background:#e4f2ea;color:var(--g);border-radius:20px;padding:3px 8px;font-size:11px}.away{background:#f6ead9;color:#875e13}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end;justify-content:center;padding:10px}.modal.show{display:flex}.modalbox{background:white;border-radius:16px;padding:17px;width:min(650px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.login{min-height:100vh;background:#142a24;display:grid;place-items:center;padding:18px}.loginbox{background:white;border-radius:18px;padding:25px;width:min(390px,100%)}.loginbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0 12px}.loginbox button{width:100%}.status{font-size:13px;color:#a33434;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.two,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}}
</style></head><body><div id="app"><div style="padding:30px">Loading HousePilot…</div></div><div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="mt"></h2><button onclick="closeModal()">Close</button></div><div id="mb"></div></div></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10),money=n=>new Intl.NumberFormat('en-GH',{style:'currency',currency:'GHS'}).format(Number(n||0)),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empty=()=>({rooms:[],tenants:[],tenancies:[],periods:[],rentPayments:[],bills:[],charges:[],waterPayments:[]});
let d,section='Dashboard';
function load(){try{d=JSON.parse(localStorage.getItem('hp-data')||'null')||empty()}catch(e){d=empty()}}
function save(){localStorage.setItem('hp-data',JSON.stringify(d))}
function login(){
 $('#app').innerHTML='<div class="login"><div class="loginbox"><div class="brand">HousePilot<small>PROPERTY RECORDS</small></div><h1 style="margin-top:22px">Welcome back</h1><p class="muted">Enter your passcode to open HousePilot.</p><form id="lf"><input id="pw" type="password" required minlength="4" placeholder="Passcode" inputmode="numeric"><button class="primary">Unlock HousePilot</button></form><p class="muted">Preview only: records are saved on this device. Secure online sync is not connected yet. Use test data only.</p><div id="err" class="status"></div></div></div>';
 $('#lf').onsubmit=e=>{e.preventDefault();const p=$('#pw').value,old=localStorage.getItem('hp-pass');if(!old)localStorage.setItem('hp-pass',p);if(p===localStorage.getItem('hp-pass')){sessionStorage.setItem('hp-open','1');load();shell()}else $('#err').textContent='Incorrect passcode. Try again.'};
}
function shell(){ $('#app').innerHTML='<header><div class="brand">HousePilot<small>PROPERTY RECORDS</small></div><button onclick="logout()">Lock</button></header><main class="wrap"><div class="notice">PREVIEW MODE — data is saved only in this browser on this device. Online syncing and secure passcode verification are not connected. Use test data only.</div><div class="tabs">'+['Dashboard','Rooms','Tenants','Rent Tracking','Water Bill'].map(x=>'<button class="tab '+(x===section?'active':'')+'" data-section="'+x+'">'+x+'</button>').join('')+'</div><div id="content"></div></main>';
 document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});render();}
window.logout=()=>{sessionStorage.removeItem('hp-open');login()};window.closeModal=()=>$('#modal').classList.remove('show');
function active(){return d.tenancies.filter(t=>t.status==='active')}function tn(id){return (d.tenants.find(t=>String(t.id)===String(id))||{}).name||'—'}function rn(id){return (d.rooms.find(r=>String(r.id)===String(id))||{}).number||'—'}function next(a){return a.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1}function sum(a,f){return a.reduce((n,x)=>n+f(x),0)}function metric(k,v){return '<div class="card"><div class="muted">'+k+'</div><div class="metric">'+v+'</div></div>'}
function render(){const c=$('#content');if(!c)return;
if(section==='Dashboard'){let due=sum(d.periods,x=>+x.amount),paid=sum(d.rentPayments,x=>+x.amount),wd=sum(d.charges,x=>+x.final),wp=sum(d.waterPayments,x=>+x.amount),occ=new Set(active().map(x=>x.room));c.innerHTML='<h1>Dashboard</h1><p class="muted">Your property at a glance.</p><div class="grid">'+metric('Total rooms',d.rooms.length)+metric('Occupied rooms',occ.size)+metric('Vacant rooms',Math.max(0,d.rooms.length-occ.size))+metric('Active tenants',active().length)+'</div><div class="two" style="margin-top:12px"><div class="card"><h2>Rent overview</h2><div class="muted">Rent due</div><div class="metric">'+money(due)+'</div><p class="muted">Collected '+money(paid)+' · Balance '+money(due-paid)+'</p></div><div class="card"><h2>Water overview</h2><div class="muted">Tenant charges</div><div class="metric">'+money(wd)+'</div><p class="muted">Collected '+money(wp)+' · Balance '+money(wd-wp)+'</p></div></div><div class="card" style="margin-top:12px"><h2>Quick actions</h2><div class="actions"><button class="primary" id="addroom">+ Add room</button><button class="secondary" id="addtenant">+ Add tenant</button><button class="secondary" id="addbill">+ Water bill</button></div></div>';$('#addroom').onclick=roomForm;$('#addtenant').onclick=tenantForm;$('#addbill').onclick=billForm}
else if(section==='Rooms'){c.innerHTML='<div class="head"><div><h1>Rooms</h1><p class="muted">Each room has its own price.</p></div><button class="primary" id="add">+ Add room</button></div><div class="card">'+(d.rooms.length?'<div class="tablewrap"><table><tr><th>Room</th><th>Type</th><th>Monthly</th><th>Yearly estimate</th><th>Status</th></tr>'+d.rooms.map(r=>{let o=active().some(t=>String(t.room)===String(r.id));return '<tr><td>'+esc(r.number)+'</td><td>'+esc(r.type)+'</td><td>'+money(r.price)+'</td><td>'+money(r.price*12)+'</td><td><span class="pill '+(o?'':'away')+'">'+(o?'Occupied':'Vacant')+'</span></td></tr>'}).join('')+'</table></div>':'<div class="empty">No rooms yet. Add your first room.</div>')+'</div>';$('#add').onclick=roomForm}
else if(section==='Tenants'){c.innerHTML='<div class="head"><div><h1>Tenants</h1><p class="muted">Register tenants and assign rooms.</p></div><button class="primary" id="add">+ Add tenant</button></div><div class="card">'+(d.tenancies.length?'<div class="tablewrap"><table><tr><th>Tenant</th><th>Room</th><th>Tenancy</th><th>Yearly rent</th><th></th></tr>'+d.tenancies.map(t=>'<tr><td><b>'+esc(tn(t.tenant))+'</b><div class="muted">'+esc(t.code||'')+' · '+esc(t.phone||'')+'</div></td><td>'+esc(rn(t.room))+'</td><td>'+esc(t.start)+' – '+esc(t.end)+'<br><span class="pill '+(t.status==='active'?'':'away')+'">'+esc(t.status)+'</span></td><td>'+money(t.yearly)+'</td><td>'+(t.status==='active'?'<button class="secondary" data-end="'+t.id+'">End</button>':'')+'</td></tr>').join('')+'</table></div>':'<div class="empty">No tenants yet.</div>')+'</div>';$('#add').onclick=tenantForm;document.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{if(confirm('End this tenancy? Past records remain saved.')){d.tenancies.find(t=>String(t.id)===b.dataset.end).status='ended';save();render()}})}
else if(section==='Rent Tracking'){c.innerHTML='<div class="head"><div><h1>Rent Tracking</h1><p class="muted">Yearly periods and separate payment records.</p></div><button class="primary" id="add">+ Rent period</button></div><div class="card">'+(d.periods.length?'<div class="tablewrap"><table><tr><th>Tenant / period</th><th>Due</th><th>Paid</th><th>Balance</th><th>Elapsed</th><th></th></tr>'+d.periods.map(p=>{let t=d.tenancies.find(x=>String(x.id)===String(p.tenancy)),paid=sum(d.rentPayments,x=>String(x.period)===String(p.id)?+x.amount:0),span=new Date(p.end)-new Date(p.start),pct=span>0?Math.max(0,Math.min(100,(Date.now()-new Date(p.start))/span*100)):0;return '<tr><td>'+esc(t?tn(t.tenant):'—')+'<div class="muted">'+esc(p.start)+' – '+esc(p.end)+'</div></td><td>'+money(p.amount)+'</td><td>'+money(paid)+'</td><td>'+money(p.amount-paid)+'</td><td>'+Math.round(pct)+'%<div class="bar"><span style="width:'+pct+'%;display:block;background:#2d9b6b;height:7px"></span></div></td><td><button class="secondary" data-pay="'+p.id+'">Payment</button></td></tr>'}).join('')+'</table></div>':'<div class="empty">No rent periods yet. Add a period.</div>')+'</div>';$('#add').onclick=periodForm;document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>rentPay(b.dataset.pay))}
else if(section==='Water Bill'){c.innerHTML='<div class="head"><div><h1>Water Bill</h1><p class="muted">Monthly bill, points, adjustments and payments.</p></div><button class="primary" id="add">+ Monthly bill</button></div><div class="card">'+(d.bills.length?d.bills.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(b=>'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="head" style="margin:0"><div><b>'+esc(b.month)+'</b><div class="muted">Actual '+money(b.actual)+' · rate/point '+money(b.rate)+'</div></div><div><b>'+money(sum(d.charges,x=>String(x.bill)===String(b.id)?+x.final:0))+'</b><div class="muted">Tenant charges</div></div></div><button class="secondary" data-charge="'+b.id+'">Manage tenant charges</button></div>').join(''):'<div class="empty">No water bills yet.</div>')+'</div>';$('#add').onclick=billForm;document.querySelectorAll('[data-charge]').forEach(b=>b.onclick=()=>chargeForm(b.dataset.charge))}
}
function showModal(title,html,fn){$('#mt').textContent=title;$('#mb').innerHTML=html;$('#modal').classList.add('show');$('#mb form').onsubmit=e=>{e.preventDefault();try{fn(Object.fromEntries(new FormData(e.target)));save();closeModal();render()}catch(err){$('#modalerr').textContent=err.message}}}
function errHtml(){return '<div id="modalerr" class="status"></div>'}
function roomForm(){showModal('Add room','<form><div class="formgrid"><div class="field"><label>Room number/name *</label><input name="number" required></div><div class="field"><label>Room type *</label><input name="type" required></div><div class="field full"><label>Monthly rent (GH₵) *</label><input name="price" type="number" min="0" step=".01" required></div></div>'+errHtml()+'<div class="actions"><button class="primary">Save room</button></div></form>',x=>{if(d.rooms.some(r=>r.number.toLowerCase()===x.number.trim().toLowerCase()))throw Error('Room number already exists.');d.rooms.push({id:next(d.rooms),number:x.number.trim(),type:x.type.trim(),price:+x.price})})}
function tenantForm(){let free=d.rooms.filter(r=>!active().some(t=>String(t.room)===String(r.id)));if(!free.length){alert('Add a vacant room first.');return}showModal('Register tenant','<form><div class="formgrid"><div class="field full"><label>Full name *</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Room *</label><select name="room">'+free.map(r=>'<option value="'+r.id+'">'+esc(r.number)+' — '+esc(r.type)+'</option>').join('')+'</select></div><div class="field"><label>Start date *</label><input name="start" type="date" value="'+today()+'" required></div><div class="field"><label>End date *</label><input name="end" type="date" required></div><div class="field"><label>Agreed monthly rent</label><input name="monthly" type="number" min="0" step=".01" required></div><div class="field"><label>Agreed yearly rent</label><input name="yearly" type="number" min="0" step=".01" required></div><div class="field full"><label>Normal water points</label><input name="points" type="number" min="0" step=".01" value="1"></div></div>'+errHtml()+'<div class="actions"><button class="primary">Save tenant</button></div></form>',x=>{if(x.end<x.start)throw Error('End date must be after start date.');let ten={id:next(d.tenants),name:x.name.trim(),phone:x.phone,code:'HP-'+String(d.tenants.length+1).padStart(4,'0')};d.tenants.push(ten);d.tenancies.push({id:next(d.tenancies),tenant:ten.id,room:+x.room,start:x.start,end:x.end,monthly:+x.monthly,yearly:+x.yearly,points:+x.points||0,status:'active',code:ten.code,phone:ten.phone})})}
function periodForm(){if(!d.tenancies.length){alert('Register a tenant first.');return}showModal('Create rent period','<form><div class="field"><label>Tenant *</label><select name="tenancy">'+d.tenancies.map(t=>'<option value="'+t.id+'">'+esc(tn(t.tenant))+' — '+esc(rn(t.room))+'</option>').join('')+'</select></div><div class="formgrid" style="margin-top:10px"><div class="field"><label>Period start *</label><input name="start" type="date" required></div><div class="field"><label>Period end *</label><input name="end" type="date" required></div><div class="field full"><label>Rent due (GH₵) *</label><input name="amount" type="number" min="0" step=".01" required></div></div>'+errHtml()+'<div class="actions"><button class="primary">Save period</button></div></form>',x=>{if(x.end<x.start)throw Error('End date must be after start date.');if(d.periods.some(p=>String(p.tenancy)===x.tenancy&&p.start===x.start))throw Error('Period already exists.');d.periods.push({id:next(d.periods),tenancy:+x.tenancy,start:x.start,end:x.end,amount:+x.amount})})}
function rentPay(n){showModal('Record rent payment','<form><div class="formgrid"><div class="field"><label>Amount (GH₵) *</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Date *</label><input name="date" type="date" value="'+today()+'" required></div><div class="field full"><label>Receipt number *</label><input name="receipt" required></div></div>'+errHtml()+'<div class="actions"><button class="primary">Save payment</button></div></form>',x=>d.rentPayments.push({id:next(d.rentPayments),period:+n,amount:+x.amount,date:x.date,receipt:x.receipt}))}
function billForm(){showModal('Add monthly water bill','<form><div class="formgrid"><div class="field"><label>Bill month *</label><input name="month" type="month" value="'+today().slice(0,7)+'" required></div><div class="field"><label>Actual bill (GH₵) *</label><input name="actual" type="number" min="0" step=".01" required></div></div>'+errHtml()+'<div class="actions"><button class="primary">Save bill</button></div></form>',x=>{if(d.bills.some(b=>b.month===x.month))throw Error('Bill for this month already exists.');let total=sum(active(),t=>+t.points||0),actual=+x.actual;d.bills.push({id:next(d.bills),month:x.month,actual,total,rate:total?Math.ceil(actual/total):0})})}
function chargeForm(n){let b=d.bills.find(x=>String(x.id)===String(n)),ts=active();if(!ts.length){alert('Register an active tenant first.');return}showModal('Manage monthly water charges','<p class="muted">Rate per point: '+money(b.rate)+'. Away means zero points for this month.</p><form>'+ts.map(t=>{let old=d.charges.find(c=>String(c.bill)===String(n)&&String(c.tenancy)===String(t.id));return '<div class="card" style="margin:9px 0"><b>'+esc(tn(t.tenant))+' — '+esc(rn(t.room))+'</b><div class="formgrid" style="margin-top:9px"><div class="field"><label>Attendance</label><select name="a'+t.id+'"><option value="present" '+(old?.attendance!=='away'?'selected':'')+'>Present</option><option value="away" '+(old?.attendance==='away'?'selected':'')+'>Away</option></select></div><div class="field"><label>Points</label><input name="p'+t.id+'" type="number" min="0" step=".01" value="'+(old?.points??t.points)+'"></div><div class="field"><label>Adjustment (+/-)</label><input name="x'+t.id+'" type="number" step=".01" value="'+(old?.adjustment??0)+'"></div><div class="field"><label>Final charge override</label><input name="f'+t.id+'" type="number" min="0" step=".01" value="'+(old?.override??'')+'" placeholder="Auto"></div></div></div>'}).join('')+errHtml()+'<div class="actions"><button class="primary">Save charges</button></div></form>',x=>{for(const t of ts){let attendance=x['a'+t.id],points=attendance==='away'?0:(+x['p'+t.id]||0),calc=points*b.rate,adjustment=+x['x'+t.id]||0,override=x['f'+t.id],final=override!==''?+override:Math.max(0,calc+adjustment);if(final<0)throw Error('Charge cannot be negative.');let old=d.charges.find(c=>String(c.bill)===String(n)&&String(c.tenancy)===String(t.id)),o={id:old?old.id:next(d.charges),bill:+n,tenancy:t.id,tenant:t.tenant,attendance,points,calc,adjustment,override,final};if(old)Object.assign(old,o);else d.charges.push(o)}})}
load();if(sessionStorage.getItem('hp-open')==='1')shell();else login();
})();
</script></body></html>
