<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142a24"><title>HousePilot</title>
<style>
:root{--g:#176b4b;--ink:#182923;--muted:#66756d;--line:#dce5df;--bg:#f3f6f4}*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:650}.primary{background:var(--g);color:white}.secondary{background:#e4f2ea;color:var(--g)}header{background:#142a24;color:white;padding:17px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800}.brand small{display:block;font-size:10px;letter-spacing:2px}.wrap{max-width:1000px;margin:auto;padding:15px}.notice{padding:12px;background:#fff5d7;border:1px solid #eadba6;border-radius:10px;font-size:13px;margin-bottom:14px}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0 16px}.tab{white-space:nowrap;background:white;border:1px solid var(--line)}.tab.active{background:var(--g);color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}.muted{font-size:13px;color:var(--muted)}.metric{font-size:24px;font-weight:800;margin-top:6px}h1{font-size:25px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;background:white}.full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.empty{text-align:center;padding:22px;color:var(--muted)}.pill{background:#e4f2ea;color:var(--g);border-radius:20px;padding:3px 8px;font-size:11px}.away{background:#f6ead9;color:#875e13}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end;justify-content:center;padding:10px}.modal.show{display:flex}.modalbox{background:white;border-radius:16px;padding:17px;width:min(650px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.login{min-height:100vh;background:#142a24;display:grid;place-items:center;padding:18px}.loginbox{background:white;border-radius:18px;padding:25px;width:min(390px,100%)}.loginbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0 12px}.loginbox button{width:100%}.status{font-size:13px;color:#a33434;margin-top:10px}@keyframes hp-track-fill{from{width:0}to{width:var(--hp-progress)}}.hp-track-fill{height:10px;border-radius:999px;background:#21865a;width:0;animation:hp-track-fill 1.1s ease-out forwards}.hp-track-bg{height:10px;border-radius:999px;background:#e5ece7;overflow:hidden}.tenant-name-link{padding:0;background:transparent;color:var(--g);border-radius:0;text-align:left;font-weight:800;text-decoration:underline;text-underline-offset:3px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.two,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}}
</style></head><body><div id="app"><div style="padding:30px">Loading HousePilot…</div></div><div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="mt"></h2><button onclick="closeModal()">Close</button></div><div id="mb"></div></div></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10),money=n=>new Intl.NumberFormat('en-GH',{style:'currency',currency:'GHS'}).format(Number(n||0)),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empty=()=>({roomTypes:[],rooms:[],tenants:[],tenancies:[],periods:[],rentPayments:[],bills:[],charges:[],waterPayments:[]});
let d,section='Dashboard';
function load(){try{d=JSON.parse(localStorage.getItem('hp-data')||'null')||empty()}catch(e){d=empty()} d.roomTypes=d.roomTypes||[]; d.rooms=d.rooms||[]; d.tenants=d.tenants||[]; d.tenancies=d.tenancies||[]; d.periods=d.periods||[]; d.rentPayments=d.rentPayments||[]; d.bills=d.bills||[]; d.charges=d.charges||[]; d.waterPayments=d.waterPayments||[]; d.rooms.forEach(r=>{if(!d.roomTypes.some(t=>t.name.toLowerCase()===String(r.type||'').toLowerCase()))d.roomTypes.push({id:next(d.roomTypes),name:r.type||'Single Room',price:+r.price||0})})}
function save(){localStorage.setItem('hp-data',JSON.stringify(d))}
function login(){
 const existing=localStorage.getItem('hp-pass');
 const setup=!existing;
 $('#app').innerHTML='<div class="login"><div class="loginbox"><div class="brand">HousePilot<small>PROPERTY RECORDS</small></div><h1 style="margin-top:22px">'+(setup?'Create your passcode':'Welcome back')+'</h1><p class="muted">'+(setup?'Choose a passcode with at least 4 characters, then confirm it.':'Enter your passcode to open HousePilot.')+'</p><form id="lf"><input id="pw" type="password" required minlength="4" placeholder="'+(setup?'Create passcode':'Passcode')+'" inputmode="numeric" autocomplete="'+(setup?'new-password':'current-password')+'">'+(setup?'<input id="pw2" type="password" required minlength="4" placeholder="Confirm passcode" inputmode="numeric" autocomplete="new-password">':'')+'<button class="primary">'+(setup?'Create passcode and unlock':'Unlock HousePilot')+'</button></form><p class="muted">Preview only: records are saved on this device. Secure online sync is not connected yet. Use test data only.</p><div id="err" class="status"></div></div></div>';
 $('#lf').onsubmit=e=>{e.preventDefault();const p=$('#pw').value,old=localStorage.getItem('hp-pass');if(setup){if(p!==$('#pw2').value){$('#err').textContent='The passcodes do not match. Please try again.';return}localStorage.setItem('hp-pass',p)}else if(p!==old){$('#err').textContent='Incorrect passcode. Try again.';return}sessionStorage.setItem('hp-open','1');load();shell()};
}
function shell(){ $('#app').innerHTML='<header><div class="brand">HousePilot<small>PROPERTY RECORDS</small></div><button onclick="logout()">Lock</button></header><main class="wrap"><div class="notice">PREVIEW MODE — data is saved only in this browser on this device. Online syncing and secure passcode verification are not connected. Use test data only.</div><div class="tabs">'+['Dashboard','Rooms','Tenants','Rent Tracking','Water Bill'].map(x=>'<button class="tab '+(x===section?'active':'')+'" data-section="'+x+'">'+x+'</button>').join('')+'</div><div id="content"></div></main>';
 document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});render();}
window.logout=()=>{sessionStorage.removeItem('hp-open');login()};window.closeModal=()=>$('#modal').classList.remove('show');
function active(){return d.tenancies.filter(t=>t.status==='active')}function expiryInfo(t){if(!t||!t.end)return null;const n=new Date(),key=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'),a=Date.parse(key+'T00:00:00Z'),b=Date.parse(t.end+'T00:00:00Z');if(!Number.isFinite(b))return null;const days=Math.round((b-a)/86400000);if(days<0)return{days,kind:'expired'};if(days===0)return{days,kind:'today'};if(days<=30)return{days,kind:'soon'};return{days,kind:'active'}}function expiryBadge(t){const e=expiryInfo(t);if(!e)return '';if(e.kind==='expired')return '<span class="pill away">Expired · '+Math.abs(e.days)+'d ago</span>';if(e.kind==='today')return '<span class="pill away">Expires today</span>';if(e.kind==='soon')return '<span class="pill away">'+e.days+' days left</span>';return ''}function expiryPanel(){const items=active().map(t=>({t,e:expiryInfo(t)})).filter(x=>x.e&&['expired','today','soon'].includes(x.e.kind)).sort((a,b)=>a.e.days-b.e.days);return '<div class="card" style="margin-top:12px"><h2>Rent expiry alerts</h2><p class="muted">Warnings appear 30 days before the tenancy end date.</p>'+(items.length?items.map(x=>'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>'+esc(tn(x.t.tenant))+'</b> · '+esc(rn(x.t.room))+'<div class="muted">End date: '+esc(x.t.end)+' · '+(x.e.kind==='expired'?'Expired '+Math.abs(x.e.days)+' day(s) ago':x.e.kind==='today'?'Expires today':x.e.days+' day(s) remaining')+'</div>'+expiryBadge(x.t)+'</div>').join(''):'<div class="empty">No tenants expiring within the next 30 days.</div>')+'</div>'}function tn(id){return (d.tenants.find(t=>String(t.id)===String(id))||{}).name||'—'}function rn(id){return (d.rooms.find(r=>String(r.id)===String(id))||{}).number||'—'}function next(a){return a.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1}function sum(a,f){return a.reduce((n,x)=>n+f(x),0)}function metric(k,v){return '<div class="card"><div class="muted">'+k+'</div><div class="metric">'+v+'</div></div>'}
function render(){const c=$('#content');if(!c)return;
if(section==='Dashboard'){let due=sum(d.periods,x=>+x.amount),paid=sum(d.rentPayments,x=>+x.amount),wd=sum(d.charges,x=>+x.final),wp=sum(d.waterPayments,x=>+x.amount),occ=new Set(active().map(x=>x.room));c.innerHTML='<h1>Dashboard</h1><p class="muted">Your property at a glance.</p><div class="grid">'+metric('Total rooms',d.rooms.length)+metric('Occupied rooms',occ.size)+metric('Vacant rooms',Math.max(0,d.rooms.length-occ.size))+metric('Active tenants',active().length)+'</div><div class="two" style="margin-top:12px"><div class="card"><h2>Rent overview</h2><div class="muted">Rent due</div><div class="metric">'+money(due)+'</div><p class="muted">Collected '+money(paid)+' · Balance '+money(due-paid)+'</p></div><div class="card"><h2>Water overview</h2><div class="muted">Tenant charges</div><div class="metric">'+money(wd)+'</div><p class="muted">Collected '+money(wp)+' · Balance '+money(wd-wp)+'</p></div></div><div class="card" style="margin-top:12px"><h2>Quick actions</h2><div class="actions"><button class="primary" id="addroom">+ Add room</button><button class="secondary" id="addtenant">+ Add tenant</button><button class="secondary" id="addbill">+ Water bill</button></div></div>';c.innerHTML+=expiryPanel();$('#addroom').onclick=roomForm;$('#addtenant').onclick=tenantForm;$('#addbill').onclick=billForm}
else if(section==='Rooms'){c.innerHTML='<div class="head"><div><h1>Rooms</h1><p class="muted">Set a price once for each room type, then create numbered physical rooms in batches.</p></div><button class="primary" id="add">+ Add room type / rooms</button></div><div class="card"><h2>Room types and normal prices</h2>'+(d.roomTypes.length?'<div class="tablewrap"><table><tr><th>Type</th><th>Monthly price</th><th>Yearly price</th><th>Rooms</th><th></th></tr>'+d.roomTypes.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+money(t.price)+'</td><td>'+money(t.price*12)+'</td><td>'+d.rooms.filter(r=>String(r.type).toLowerCase()===String(t.name).toLowerCase()).length+'</td><td><div class="actions" style="margin:0"><button class="secondary" data-edittype="'+t.id+'">Edit</button><button class="secondary" data-price="'+t.id+'">Change price</button><button class="secondary" data-deletetype="'+t.id+'">Delete</button></div></td></tr>').join('')+'</table></div>':'<div class="empty">No room types yet.</div>')+'</div><div class="card" style="margin-top:12px"><h2>Physical rooms and availability</h2>'+(d.rooms.length?'<div class="tablewrap"><table><tr><th>Room</th><th>Type</th><th>Normal monthly</th><th>Yearly estimate</th><th>Status</th><th>Actions</th></tr>'+d.rooms.map(r=>{let o=active().some(t=>String(t.room)===String(r.id));let rt=d.roomTypes.find(t=>t.name.toLowerCase()===String(r.type).toLowerCase());let price=rt?+rt.price:+r.price;return '<tr><td>'+esc(r.number)+'</td><td>'+esc(r.type)+'</td><td>'+money(price)+'</td><td>'+money(price*12)+'</td><td><span class="pill '+(o?'':'away')+'">'+(o?'Occupied':'Vacant')+'</span></td><td><div class="actions" style="margin:0"><button class="secondary" data-editroom="'+r.id+'">Edit</button><button class="secondary" data-deleteroom="'+r.id+'">Delete</button></div></td></tr>'}).join('')+'</table></div>':'<div class="empty">No physical rooms yet. Add a room type and quantity.</div>')+'</div>';$('#add').onclick=roomForm;document.querySelectorAll('[data-price]').forEach(b=>b.onclick=()=>priceForm(b.dataset.price));document.querySelectorAll('[data-edittype]').forEach(b=>b.onclick=()=>editTypeForm(b.dataset.edittype));document.querySelectorAll('[data-deletetype]').forEach(b=>b.onclick=()=>deleteType(b.dataset.deletetype));document.querySelectorAll('[data-editroom]').forEach(b=>b.onclick=()=>editRoomForm(b.dataset.editroom));document.querySelectorAll('[data-deleteroom]').forEach(b=>b.onclick=()=>deleteRoom(b.dataset.deleteroom))}
else if(section==='Tenants'){c.innerHTML='<div class="head"><div><h1>Tenants</h1><p class="muted">Register tenants and assign rooms.</p></div><button class="primary" id="add">+ Add tenant</button></div><div class="card">'+(d.tenancies.length?'<div class="tablewrap"><table><tr><th>Tenant</th><th>Room</th><th>Tenancy</th><th>Yearly rent</th><th></th></tr>'+d.tenancies.map(t=>'<tr><td><button class="tenant-name-link" data-tenantdetails="'+t.tenant+'">'+esc(tn(t.tenant))+'</button><div class="muted">'+esc(t.code||'')+' · '+esc(t.phone||'')+'</div></td><td>'+esc(rn(t.room))+'<div class="muted">'+(t.arrangement==='family'?'Family · water only':'Rental')+'</div></td><td>'+esc(t.start)+' – '+esc(t.end)+'<br><span class="pill '+(t.status==='active'?'':'away')+'">'+esc(t.status)+'</span> '+(t.status==='active'?expiryBadge(t):'')+'</td><td>'+money(t.yearly)+'</td><td><div class="actions" style="margin:0"><button class="secondary" data-edittens="'+t.tenant+'">Edit tenant</button>'+(t.status==='active'?'<button class="secondary" data-end="'+t.id+'">End</button>':'')+'</div></td></tr>').join('')+'</table></div>':'<div class="empty">No tenants yet.</div>')+'</div>';$('#add').onclick=tenantForm;document.querySelectorAll('[data-tenantdetails]').forEach(b=>b.onclick=()=>tenantDetails(b.dataset.tenantdetails));document.querySelectorAll('[data-edittens]').forEach(b=>b.onclick=()=>editTenantForm(b.dataset.edittens));document.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{if(confirm('End this tenancy? Past records remain saved.')){d.tenancies.find(t=>String(t.id)===b.dataset.end).status='ended';save();render()}})}
else if(section==='Rent Tracking'){c.innerHTML='<div class="head"><div><h1>Rent Tracking</h1><p class="muted">Yearly periods and separate payment records.</p></div><button class="primary" id="add">+ Rent period</button></div><div class="card">'+(d.periods.length?'<div class="tablewrap"><table><tr><th>Tenant / period</th><th>Due</th><th>Paid</th><th>Balance</th><th>Elapsed</th><th></th></tr>'+d.periods.map(p=>{let t=d.tenancies.find(x=>String(x.id)===String(p.tenancy)),paid=sum(d.rentPayments,x=>String(x.period)===String(p.id)?+x.amount:0),span=new Date(p.end)-new Date(p.start),pct=span>0?Math.max(0,Math.min(100,(Date.now()-new Date(p.start))/span*100)):0;return '<tr><td>'+esc(t?tn(t.tenant):'—')+'<div class="muted">'+esc(p.start)+' – '+esc(p.end)+'</div></td><td>'+money(p.amount)+'</td><td>'+money(paid)+'</td><td>'+money(p.amount-paid)+'</td><td>'+Math.round(pct)+'%<div class="bar"><span style="width:'+pct+'%;display:block;background:#2d9b6b;height:7px"></span></div></td><td><button class="secondary" data-pay="'+p.id+'">Payment</button></td></tr>'}).join('')+'</table></div>':'<div class="empty">No rent periods yet. Add a period.</div>')+'</div>';$('#add').onclick=periodForm;document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>rentPay(b.dataset.pay))}
else if(section==='Water Bill'){c.innerHTML='<div class="head"><div><h1>Water Bill</h1><p class="muted">Monthly bill, points, adjustments and payments.</p></div><button class="primary" id="add">+ Monthly bill</button></div><div class="card">'+(d.bills.length?d.bills.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(b=>'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="head" style="margin:0"><div><b>'+esc(b.month)+'</b><div class="muted">Actual '+money(b.actual)+' · rate/point '+money(b.rate)+'</div></div><div><b>'+money(sum(d.charges,x=>String(x.bill)===String(b.id)?+x.final:0))+'</b><div class="muted">Tenant charges</div></div></div><button class="secondary" data-charge="'+b.id+'">Manage tenant charges</button></div>').join(''):'<div class="empty">No water bills yet.</div>')+'</div>';$('#add').onclick=billForm;document.querySelectorAll('[data-charge]').forEach(b=>b.onclick=()=>chargeForm(b.dataset.charge))}
}
function showModal(title,html,fn){$('#mt').textContent=title;$('#mb').innerHTML=html;$('#modal').classList.add('show');const form=$('#mb form');if(form)form.onsubmit=e=>{e.preventDefault();try{fn(Object.fromEntries(new FormData(e.target)));save();closeModal();render()}catch(err){const out=$('#modalerr');if(out)out.textContent=err.message;else alert(err.message)}}}
function errHtml(){return '<div id="modalerr" class="status"></div>'}
function roomForm(){showModal('Add room type and physical rooms','<form><div class="formgrid"><div class="field full"><label>Room type *</label><input name="type" placeholder="Single Room" required></div><div class="field"><label>Normal monthly price (GH₵) *</label><input name="price" type="number" min="0" step=".01" required></div><div class="field"><label>How many physical rooms? *</label><input name="qty" type="number" min="1" step="1" value="1" required></div><div class="field full"><label>First room number *</label><input name="prefix" placeholder="e.g. Single Room" required><small class="muted">Creates names such as Single Room 1, Single Room 2, Single Room 3.</small></div></div><p class="muted">Yearly price is calculated automatically as monthly price × 12. Updating a type price changes the normal price shown for its rooms, but never rewrites old tenancy periods.</p>'+errHtml()+'<div class="actions"><button class="primary">Save room type and rooms</button></div></form>',x=>{let name=x.type.trim(),price=+x.price,qty=Math.floor(+x.qty),prefix=x.prefix.trim();if(qty<1)throw Error('Enter at least one physical room.');let rt=d.roomTypes.find(t=>t.name.toLowerCase()===name.toLowerCase());if(rt){rt.price=price}else{rt={id:next(d.roomTypes),name,price};d.roomTypes.push(rt)}let existing=new Set(d.rooms.map(r=>r.number.toLowerCase()));let created=0;for(let i=1;i<=qty;i++){let number=prefix+' '+i;if(existing.has(number.toLowerCase()))continue;d.rooms.push({id:next(d.rooms),number,type:name,price});existing.add(number.toLowerCase());created++}if(created===0)throw Error('Those room numbers already exist. Use a different first room name or quantity.');})}

function editTypeForm(id){
 let rt=d.roomTypes.find(t=>String(t.id)===String(id));if(!rt)return;
 showModal('Edit room type','<form><div class="field"><label>Room type name *</label><input name="name" value="'+esc(rt.name)+'" required></div><p class="muted">Changing the name also updates physical rooms of this type. Normal price is managed separately with Change price.</p>'+errHtml()+'<div class="actions"><button class="primary">Save changes</button></div></form>',x=>{
  let name=x.name.trim();if(!name)throw Error('Enter a room type name.');
  if(d.roomTypes.some(t=>t.id!==rt.id&&t.name.toLowerCase()===name.toLowerCase()))throw Error('A room type with that name already exists.');
  const old=rt.name;rt.name=name;d.rooms.filter(r=>String(r.type).toLowerCase()===old.toLowerCase()).forEach(r=>r.type=name);
 });
}
function deleteType(id){
 let rt=d.roomTypes.find(t=>String(t.id)===String(id));if(!rt)return;
 if(d.rooms.some(r=>String(r.type).toLowerCase()===rt.name.toLowerCase())){alert('This room type cannot be deleted while physical rooms use it. Delete eligible unused rooms first.');return}
 if(!confirm('Delete room type "'+rt.name+'"? This cannot be undone.'))return;
 d.roomTypes=d.roomTypes.filter(t=>String(t.id)!==String(id));save();render();
}
function editRoomForm(id){
 let r=d.rooms.find(x=>String(x.id)===String(id));if(!r)return;
 const hasHistory=d.tenancies.some(t=>String(t.room)===String(r.id));
 showModal('Edit physical room','<form><div class="field"><label>Room number / name *</label><input name="number" value="'+esc(r.number)+'" required></div><div class="field" style="margin-top:10px"><label>Room type *</label><select name="type">'+d.roomTypes.map(t=>'<option value="'+esc(t.name)+'" '+(t.name.toLowerCase()===String(r.type).toLowerCase()?'selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></div><p class="muted">'+(hasHistory?'This room has tenancy history, so its room type is locked to protect old records.':'You can correct the room name and type. The normal price comes from the selected room type.')+'</p>'+errHtml()+'<div class="actions"><button class="primary">Save changes</button></div></form>',x=>{
  const number=x.number.trim();if(!number)throw Error('Enter a room number.');
  if(d.rooms.some(y=>String(y.id)!==String(r.id)&&y.number.toLowerCase()===number.toLowerCase()))throw Error('That room number already exists.');
  if(hasHistory&&x.type.toLowerCase()!==String(r.type).toLowerCase())throw Error('Room type cannot be changed because this room has tenancy history.');
  if(!d.roomTypes.some(t=>t.name.toLowerCase()===x.type.toLowerCase()))throw Error('Select a valid room type.');
  r.number=number;if(!hasHistory)r.type=x.type;
 });
}
function deleteRoom(id){
 let r=d.rooms.find(x=>String(x.id)===String(id));if(!r)return;
 if(d.tenancies.some(t=>String(t.room)===String(r.id))){alert('This room has tenancy history and cannot be deleted. Use End / Move Out for an active tenancy so the history is preserved.');return}
 if(!confirm('Delete unused room "'+r.number+'"? This cannot be undone.'))return;
 d.rooms=d.rooms.filter(x=>String(x.id)!==String(id));save();render();
}

function tenantDetails(id){
 const person=d.tenants.find(x=>String(x.id)===String(id));if(!person)return;
 const tenancies=d.tenancies.filter(t=>String(t.tenant)===String(id));
 const moneyCell=n=>money(Number(n)||0);
 const periodRows=tenancies.flatMap(t=>d.periods.filter(p=>String(p.tenancy)===String(t.id)).map(p=>({p,t})));
 const paidAll=sum(d.rentPayments,p=>periodRows.some(z=>String(z.p.id)===String(p.period))?(+p.amount||0):0);
 const dueAll=sum(periodRows,z=>+z.p.amount||0);
 const waterRows=d.charges.filter(c=>tenancies.some(t=>String(t.id)===String(c.tenancy)));
 const waterDue=sum(waterRows,c=>+c.final||0);

 const tenancyCards=tenancies.map(t=>{

  const start=new Date((t.start||today())+'T00:00:00'),end=new Date((t.end||today())+'T23:59:59'),now=new Date();
  const total=end-start,elapsed=now-start,pct=total>0?Math.max(0,Math.min(100,elapsed/total*100)):0;
  const periods=d.periods.filter(p=>String(p.tenancy)===String(t.id));

   return '<div class="card" style="margin-top:9px"><b>Rent period: '+esc(p.start)+' – '+esc(p.end)+'</b><p class="muted">Due '+moneyCell(p.amount)+' · Paid '+moneyCell(paid)+' · Balance '+moneyCell((+p.amount||0)-paid)+'</p>'+(pays.length?'<div class="muted">'+pays.map(x=>'Payment '+moneyCell(x.amount)+' · '+esc(x.date||'Date not recorded')+' · Receipt '+esc(x.receipt||'—')).join('<br>')+'</div>':'<div class="muted">No payments recorded for this period.</div>')+'</div>';
  }).join('');
  const water=waterRows.filter(c=>String(c.tenancy)===String(t.id));
  return '<div class="card" style="margin-top:12px"><h2>'+esc(room?room.number:'Room unavailable')+' · '+esc(room?room.type:'')+'</h2><div class="muted">Tenancy '+esc(t.status||'unknown')+' · '+(t.arrangement==='family'?'Family — water only':'Rental')+'</div><p>Start: <b>'+esc(t.start||'—')+'</b><br>End: <b>'+esc(t.end||'—')+'</b><br>Monthly rent: <b>'+moneyCell(t.monthly)+'</b> · Yearly rent: <b>'+moneyCell(t.yearly)+'</b><br>Water points: <b>'+esc(t.points??0)+'</b></p><div class="muted" style="margin-bottom:6px">Rental period progress · '+Math.round(pct)+'% elapsed</div><div class="hp-track-bg"><div class="hp-track-fill" style="--hp-progress:'+pct+'%"></div></div><div class="muted" style="margin-top:6px">Progress is based on the tenancy dates, not on whether rent has been paid.</div><h2 style="margin-top:16px">Rent periods and payments</h2>'+(rows||'<p class="muted">No rent periods recorded for this tenancy.</p>')+'<h2 style="margin-top:16px">Water charges</h2>'+(water.length?water.map(c=>{const bill=d.bills.find(b=>String(b.id)===String(c.bill));return '<div class="muted" style="padding:6px 0;border-bottom:1px solid var(--line)">'+esc(bill?bill.month:'Water bill')+' · Charge '+moneyCell(c.final)+' · Points '+esc(c.points??0)+'</div>'}).join(''):'<p class="muted">No water charges recorded for this tenancy.</p>')+'</div>';
 }).join('');
 const tenantHistory=tenancies.length;
 showModal('Tenant details','<div class="card"><h2>'+esc(person.name)+'</h2><p class="muted">Tenant ID: '+esc(person.code||('HP-'+person.id))+'</p><p>Phone: <b>'+esc(person.phone||'Not provided')+'</b></p><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px"><div class="card"><div class="muted">Rent due</div><b>'+moneyCell(dueAll)+'</b></div><div class="card"><div class="muted">Rent paid</div><b>'+moneyCell(paidAll)+'</b></div><div class="card"><div class="muted">Rent balance</div><b>'+moneyCell(dueAll-paidAll)+'</b></div><div class="card"><div class="muted">Water charges</div><b>'+moneyCell(waterDue)+'</b></div></div><div class="actions"><button class="primary" id="profileEdit">Edit tenant details</button></div></div><h2 style="margin-top:16px">Tenancy history ('+tenantHistory+')</h2>'+(tenancyCards||'<div class="empty">No tenancy records found.</div>')+'<div class="actions"><button class="secondary" onclick="closeModal()">Close details</button></div>',()=>{});

function editTenantForm(id){
 let t=d.tenants.find(x=>String(x.id)===String(id));if(!t)return;
 showModal('Edit tenant details','<form><div class="field"><label>Full name *</label><input name="name" value="'+esc(t.name)+'" required></div><div class="field" style="margin-top:10px"><label>Phone</label><input name="phone" value="'+esc(t.phone||'')+'"></div><p class="muted">This corrects the tenant profile and does not change past rent periods or payments.</p>'+errHtml()+'<div class="actions"><button class="primary">Save changes</button><button type="button" class="secondary" id="deletetenant">Delete tenant</button></div></form>',x=>{
  t.name=x.name.trim();t.phone=x.phone.trim();
  d.tenancies.filter(y=>String(y.tenant)===String(t.id)).forEach(y=>{y.phone=t.phone;y.code=t.code});
 });
 const del=$('#deletetenant');
 del.onclick=()=>{

function priceForm(id){let rt=d.roomTypes.find(t=>String(t.id)===String(id));if(!rt)return;showModal('Change normal room-type price','<form><p class="muted">This changes the normal price for new tenants and the suggested price at renewals. It does not change old rent periods or payments.</p><div class="field"><label>Room type</label><input value="'+esc(rt.name)+'" readonly></div><div class="field" style="margin-top:10px"><label>New monthly price (GH₵) *</label><input name="price" type="number" min="0" step=".01" value="'+rt.price+'" required></div><p class="muted">Yearly price: monthly × 12.</p>'+errHtml()+'<div class="actions"><button class="primary">Save new price</button></div></form>',x=>{rt.price=+x.price;d.rooms.filter(r=>String(r.type).toLowerCase()===rt.name.toLowerCase()).forEach(r=>r.price=rt.price)})}
function tenantForm(){let free=d.rooms.filter(r=>!active().some(t=>String(t.room)===String(r.id)));if(!free.length){alert('There are no vacant rooms. Add physical rooms or end a tenancy first.');return}showModal('Register tenant','<form><div class="formgrid"><div class="field full"><label>Full name *</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Room type and room number *</label><select name="room">'+free.map(r=>'<option value="'+r.id+'">'+esc(r.type)+' — '+esc(r.number)+'</option>').join('')+'</select></div><div class="field"><label>Start date *</label><input name="start" type="date" value="'+today()+'" required></div><div class="field"><label>Rental duration *</label><select name="years"><option value="1">1 year</option><option value="2">2 years</option><option value="3">3 years</option></select></div><div class="field"><label>Monthly rent (automatic)</label><input id="tenantMonthly" readonly value=""></div><div class="field"><label>Total for duration (automatic)</label><input id="tenantTotal" readonly value=""></div><div class="field full"><label>Occupancy arrangement</label><select name="arrangement"><option value="rental">Paying tenant</option><option value="family">Family — no rent, water only</option></select></div><div class="field full"><label>Normal water points</label><input name="points" type="number" min="0" step=".01" value="1"></div></div><p class="muted">Price is filled from the selected room type. Family occupants have GH₵0 rent. End date is calculated from the start date and duration.</p>'+errHtml()+'<div class="actions"><button class="primary">Save tenant</button></div></form>',x=>{let room=d.rooms.find(r=>String(r.id)===String(x.room));if(!room)throw Error('Please select a room.');if(active().some(t=>String(t.room)===String(room.id)))throw Error('That room is already occupied.');let rt=d.roomTypes.find(t=>t.name.toLowerCase()===String(room.type).toLowerCase());let monthly=x.arrangement==='family'?0:(rt?+rt.price:+room.price);let startDate=new Date(x.start+'T12:00:00');let endDate=new Date(startDate);endDate.setFullYear(endDate.getFullYear()+Number(x.years));endDate.setDate(endDate.getDate()-1);let end=endDate.toISOString().slice(0,10);let ten={id:next(d.tenants),name:x.name.trim(),phone:x.phone,code:'HP-'+String(d.tenants.length+1).padStart(4,'0')};d.tenants.push(ten);let tenancy={id:next(d.tenancies),tenant:ten.id,room:+x.room,start:x.start,end,monthly,yearly:monthly*12,points:+x.points||0,status:'active',code:ten.code,phone:ten.phone,arrangement:x.arrangement};d.tenancies.push(tenancy);if(x.arrangement!=='family'){let period={id:next(d.periods),tenancy:tenancy.id,start:x.start,end,amount:monthly*12*Number(x.years)};d.periods.push(period)}});let form=$('#mb form');function update(){let room=d.rooms.find(r=>String(r.id)===form.room.value),rt=room&&d.roomTypes.find(t=>t.name.toLowerCase()===String(room.type).toLowerCase()),monthly=form.arrangement.value==='family'?0:(rt?+rt.price:+(room&&room.price)||0);let years=+form.years.value;$('#tenantMonthly').value=money(monthly);$('#tenantTotal').value=money(monthly*12*years)}form.room.onchange=update;form.years.onchange=update;form.arrangement.onchange=update;update()}
function periodForm(){let ts=active().filter(t=>t.arrangement!=='family');if(!ts.length){alert('No active paying tenants yet. Register a paying tenant first.');return}showModal('Create rent period / renewal','<form><div class="field"><label>Tenant *</label><select name="tenancy">'+ts.map(t=>'<option value="'+t.id+'">'+esc(tn(t.tenant))+' — '+esc(rn(t.room))+'</option>').join('')+'</select></div><div class="formgrid" style="margin-top:10px"><div class="field"><label>Period start *</label><input name="start" type="date" value="'+today()+'" required></div><div class="field"><label>Duration *</label><select name="years"><option value="1">1 year</option><option value="2">2 years</option><option value="3">3 years</option></select></div><div class="field"><label>Suggested monthly price</label><input name="monthly" type="number" min="0" step=".01" required></div><div class="field"><label>Total rent due (automatic)</label><input name="amount" type="number" readonly></div></div><p class="muted">Suggested price comes from the current room-type price. You can change it here for this renewal. The previous period and payments are preserved.</p>'+errHtml()+'<div class="actions"><button class="primary">Save rent period</button></div></form>',x=>{let t=d.tenancies.find(y=>String(y.id)===String(x.tenancy));if(!t)throw Error('Select a tenant.');let startDate=new Date(x.start+'T12:00:00'),endDate=new Date(startDate);endDate.setFullYear(endDate.getFullYear()+Number(x.years));endDate.setDate(endDate.getDate()-1);let end=endDate.toISOString().slice(0,10);if(d.periods.some(p=>String(p.tenancy)===x.tenancy&&p.start===x.start))throw Error('A rent period already starts on that date.');let monthly=+x.monthly,amount=monthly*12*Number(x.years);d.periods.push({id:next(d.periods),tenancy:+x.tenancy,start:x.start,end,amount,monthly,years:+x.years});t.monthly=monthly;t.yearly=monthly*12;t.start=x.start;t.end=end});let form=$('#mb form');function update(){let t=d.tenancies.find(y=>String(y.id)===form.tenancy.value),room=t&&d.rooms.find(r=>String(r.id)===String(t.room)),rt=room&&d.roomTypes.find(z=>z.name.toLowerCase()===String(room.type).toLowerCase()),p=rt?+rt.price:+(room&&room.price)||0;form.monthly.value=p;form.amount.value=p*12*Number(form.years.value)}form.tenancy.onchange=update;form.years.onchange=update;form.monthly.oninput=()=>form.amount.value=(+form.monthly.value||0)*12*Number(form.years.value);update()}
function rentPay(n){showModal('Record rent payment','<form><div class="formgrid"><div class="field"><label>Amount (GH₵) *</label><input name="amount" type="number" min=".01" step=".01" required></div><div class="field"><label>Date *</label><input name="date" type="date" value="'+today()+'" required></div><div class="field full"><label>Receipt number *</label><input name="receipt" required></div></div>'+errHtml()+'<div class="actions"><button class="primary">Save payment</button></div></form>',x=>d.rentPayments.push({id:next(d.rentPayments),period:+n,amount:+x.amount,date:x.date,receipt:x.receipt}))}

function chargeForm(n){let b=d.bills.find(x=>String(x.id)===String(n)),ts=active();if(!ts.length){alert('Register an active tenant first.');return}showModal('Manage monthly water charges','<p class="muted">Rate per point: '+money(b.rate)+'. Away means zero points for this month.</p><form>'+ts.map(t=>{let old=d.charges.find(c=>String(c.bill)===String(n)&&String(c.tenancy)===String(t.id));return '<div class="card" style="margin:9px 0"><b>'+esc(tn(t.tenant))+' — '+esc(rn(t.room))+'</b><div class="formgrid" style="margin-top:9px"><div class="field"><label>Attendance</label><select name="a'+t.id+'"><option value="present" '+(old?.attendance!=='away'?'selected':'')+'>Present</option><option value="away" '+(old?.attendance==='away'?'selected':'')+'>Away</option></select></div><div class="field"><label>Points</label><input name="p'+t.id+'" type="number" min="0" step=".01" value="'+(old?.points??t.points)+'"></div><div class="field"><label>Adjustment (+/-)</label><input name="x'+t.id+'" type="number" step=".01" value="'+(old?.adjustment??0)+'"></div><div class="field"><label>Final charge override</label><input name="f'+t.id+'" type="number" min="0" step=".01" value="'+(old?.override??'')+'" placeholder="Auto"></div></div></div>'}).join('')+errHtml()+'<div class="actions"><button class="primary">Save charges</button></div></form>',x=>{for(const t of ts){let attendance=x['a'+t.id],points=attendance==='away'?0:(+x['p'+t.id]||0),calc=points*b.rate,adjustment=+x['x'+t.id]||0,override=x['f'+t.id],final=override!==''?+override:Math.max(0,calc+adjustment);if(final<0)throw Error('Charge cannot be negative.');let old=d.charges.find(c=>String(c.bill)===String(n)&&String(c.tenancy)===String(t.id)),o={id:old?old.id:next(d.charges),bill:+n,tenancy:t.id,tenant:t.tenant,attendance,points,calc,adjustment,override,final};if(old)Object.assign(old,o);else d.charges.push(o)}})}
load();if(sessionStorage.getItem('hp-open')==='1')shell();else login();
