<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142a24"><title>HousePilot</title>
<style>
:root{--g:#176b4b;--ink:#182923;--muted:#66756d;--line:#dce5df;--bg:#f3f6f4}*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font-weight:650}.primary{background:var(--g);color:white}.secondary{background:#e4f2ea;color:var(--g)}header{background:#142a24;color:white;padding:17px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800}.brand small{display:block;font-size:10px;letter-spacing:2px}.wrap{max-width:1000px;margin:auto;padding:15px}.notice{padding:12px;background:#fff5d7;border:1px solid #eadba6;border-radius:10px;font-size:13px;margin-bottom:14px}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0 16px}.tab{white-space:nowrap;background:white;border:1px solid var(--line)}.tab.active{background:var(--g);color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}.muted{font-size:13px;color:var(--muted)}.metric{font-size:24px;font-weight:800;margin-top:6px}h1{font-size:25px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{padding:10px;border:1px solid var(--line);border-radius:8px;width:100%;background:white}.full{grid-column:1/-1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.empty{text-align:center;padding:22px;color:var(--muted)}.pill{background:#e4f2ea;color:var(--g);border-radius:20px;padding:3px 8px;font-size:11px}.away{background:#f6ead9;color:#875e13}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end;justify-content:center;padding:10px}.modal.show{display:flex}.modalbox{background:white;border-radius:16px;padding:17px;width:min(650px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.login{min-height:100vh;background:#142a24;display:grid;place-items:center;padding:18px}.loginbox{background:white;border-radius:18px;padding:25px;width:min(390px,100%)}.loginbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0 12px}.loginbox button{width:100%}.status{font-size:13px;color:#a33434;margin-top:10px}@keyframes hp-track-fill{from{width:0}to{width:var(--hp-progress)}}.hp-track-fill{height:10px;border-radius:999px;background:#21865a;width:0;animation:hp-track-fill 1.1s ease-out forwards}.hp-track-bg{height:10px;border-radius:999px;background:#e5ece7;overflow:hidden}.tenant-name-link{padding:0;background:transparent;color:var(--g);border-radius:0;text-align:left;font-weight:800;text-decoration:underline;text-underline-offset:3px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.two,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px}}
</style></head><body><div id="app"><div style="padding:30px">Loading HousePilot…</div></div><div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="mt"></h2><button onclick="closeModal()">Close</button></div><div id="mb"></div></div></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),today=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')},money=n=>new Intl.NumberFormat('en-GH',{style:'currency',currency:'GHS'}).format(Number(n||0)),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empty=()=>({roomTypes:[],rooms:[],tenants:[],tenancies:[],periods:[],rentPayments:[],bills:[],charges:[],waterPayments:[]});
let d,section='Dashboard';
function load(){if(localStorage.getItem('hp-fresh-start-v2')!=='done'){localStorage.setItem('hp-data',JSON.stringify(empty()));localStorage.setItem('hp-fresh-start-v2','done')}try{d=JSON.parse(localStorage.getItem('hp-data')||'null')||empty()}catch(e){d=empty()} d.roomTypes=d.roomTypes||[]; d.rooms=d.rooms||[]; d.tenants=d.tenants||[]; d.tenancies=d.tenancies||[]; d.tenancies.forEach(t=>{if(t.points==null)t.points=1}); d.periods=d.periods||[]; d.rentPayments=d.rentPayments||[]; d.bills=d.bills||[]; d.charges=d.charges||[]; d.waterPayments=d.waterPayments||[]; d.rooms.forEach(r=>{if(!d.roomTypes.some(t=>t.name.toLowerCase()===String(r.type||'').toLowerCase()))d.roomTypes.push({id:next(d.roomTypes),name:r.type||'Single Room',price:+r.price||0})})}
function save(){localStorage.setItem('hp-data',JSON.stringify(d))}
function login(){
 const existing=localStorage.getItem('hp-pass');
 const setup=!existing;
 $('#app').innerHTML='<div class="login"><div class="loginbox"><div class="brand">HousePilot<small>PROPERTY RECORDS</small></div><h1 style="margin-top:22px">'+(setup?'Create your passcode':'Welcome back')+'</h1><p class="muted">'+(setup?'Choose a passcode with at least 4 characters, then confirm it.':'Enter your passcode to open HousePilot.')+'</p><form id="lf"><input id="pw" type="password" required minlength="4" placeholder="'+(setup?'Create passcode':'Passcode')+'" inputmode="numeric" autocomplete="'+(setup?'new-password':'current-password')+'">'+(setup?'<input id="pw2" type="password" required minlength="4" placeholder="Confirm passcode" inputmode="numeric" autocomplete="new-password">':'')+'<button class="primary">'+(setup?'Create passcode and unlock':'Unlock HousePilot')+'</button></form><p class="muted">Local mode: records are saved on this device only. Online sync and server-side passcode security are not connected yet.</p><div id="err" class="status"></div></div></div>';
 $('#lf').onsubmit=e=>{e.preventDefault();const p=$('#pw').value,old=localStorage.getItem('hp-pass');if(setup){if(p!==$('#pw2').value){$('#err').textContent='The passcodes do not match. Please try again.';return}localStorage.setItem('hp-pass',p)}else if(p!==old){$('#err').textContent='Incorrect passcode. Try again.';return}sessionStorage.setItem('hp-open','1');load();shell()};
}
function shell(){ $('#app').innerHTML='<header><div class="brand">HousePilot<small>PROPERTY RECORDS</small></div><button onclick="logout()">Lock</button></header><main class="wrap"><div class="notice">LOCAL MODE — records are saved only in this browser on this device. Online syncing and server-side passcode security are not connected. Keep this limitation in mind when entering records.</div><div class="tabs">'+['Dashboard','Rooms','Tenants','Ended Tenants','Rent Tracking','Water Bill'].map(x=>'<button class="tab '+(x===section?'active':'')+'" data-section="'+x+'">'+x+'</button>').join('')+'</div><div id="content"></div></main>';
 document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});render();}
window.logout=()=>{sessionStorage.removeItem('hp-open');login()};window.closeModal=()=>$('#modal').classList.remove('show');
function active(){return d.tenancies.filter(t=>t.status==='active')}function expiryInfo(t){if(!t||!t.end)return null;const n=new Date(),key=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'),a=Date.parse(key+'T00:00:00Z'),b=Date.parse(t.end+'T00:00:00Z');if(!Number.isFinite(b))return null;const days=Math.round((b-a)/86400000);if(days<0)return{days,kind:'expired'};if(days===0)return{days,kind:'today'};if(days<=30)return{days,kind:'soon'};return{days,kind:'active'}}function expiryBadge(t){const e=expiryInfo(t);if(!e)return '';if(e.kind==='expired')return '<span class="pill away">Expired · '+Math.abs(e.days)+'d ago</span>';if(e.kind==='today')return '<span class="pill away">Expires today</span>';if(e.kind==='soon')return '<span class="pill away">'+e.days+' days left</span>';return ''}function expiryPanel(){const items=active().map(t=>({t,e:expiryInfo(t)})).filter(x=>x.e&&['expired','today','soon'].includes(x.e.kind)).sort((a,b)=>a.e.days-b.e.days);return '<div class="card" style="margin-top:12px"><h2>Rent expiry alerts</h2><p class="muted">Warnings appear 30 days before the tenancy end date.</p>'+(items.length?items.map(x=>'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>'+esc(tn(x.t.tenant))+'</b> · '+esc(rn(x.t.room))+'<div class="muted">End date: '+esc(dateDisplay(x.t.end))+' · '+(x.e.kind==='expired'?'Expired '+Math.abs(x.e.days)+' day(s) ago':x.e.kind==='today'?'Expires today':x.e.days+' day(s) remaining')+'</div>'+expiryBadge(x.t)+'</div>').join(''):'<div class="empty">No tenants expiring within the next 30 days.</div>')+'</div>'}function tn(id){return (d.tenants.find(t=>String(t.id)===String(id))||{}).name||'—'}function rn(id){return (d.rooms.find(r=>String(r.id)===String(id))||{}).number||'—'}function next(a){return a.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1}
function roomGroup(name){const s=String(name||'').toLowerCase().replace(/\s+/g,' ').trim();if(/\bsingle\b/.test(s))return 'single';if(s.includes('chamber')||s.includes('hall'))return 'chamber';return 'other:'+s}
function roomDescription(name){return /no washroom/i.test(String(name||''))?'With No Washroom':/washroom/i.test(String(name||''))?'With Washroom':''}
function roomBase(name){return String(name||'').replace(/\s*(with no washroom|without washroom|with washroom|no washroom)\s*/ig,' ').replace(/\s+/g,' ').trim()}
function datePlusYears(date,years){if(!date)return '';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date);if(!m)return '';const y=+m[1],mo=+m[2]-1,day=+m[3],targetYear=y+(+years||0);const last=new Date(Date.UTC(targetYear,mo+1,0)).getUTCDate();return targetYear+'-'+String(mo+1).padStart(2,'0')+'-'+String(Math.min(day,last)).padStart(2,'0')}
function dateDisplay(date){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(date||''));return m?m[3]+'/'+m[2]+'/'+m[1]:(date||'—')}
function safeDeleteLinked(label){return confirm('Delete '+label+'? Linked history and totals may change. This action cannot be undone.')}function sum(a,f){return a.reduce((n,x)=>n+f(x),0)}function metric(k,v){return '<div class="card"><div class="muted">'+k+'</div><div class="metric">'+v+'</div></div>'}
function render(){const c=$('#content');if(!c)return;
if(section==='Dashboard'){let due=sum(d.periods,x=>+x.amount),paid=sum(d.rentPayments,x=>+x.amount),wd=sum(d.charges,x=>+x.final),wp=sum(d.waterPayments,x=>+x.amount),occ=new Set(active().map(x=>x.room));c.innerHTML='<h1>Dashboard</h1><p class="muted">Your property at a glance.</p><div class="grid">'+metric('Total rooms',d.rooms.length)+metric('Occupied rooms',occ.size)+metric('Vacant rooms',Math.max(0,d.rooms.length-occ.size))+metric('Active tenants',active().length)+'</div><div class="two" style="margin-top:12px"><div class="card"><h2>Rent overview</h2><div class="muted">Rent due</div><div class="metric">'+money(due)+'</div><p class="muted">Collected '+money(paid)+' · Balance '+money(due-paid)+'</p></div><div class="card"><h2>Water overview</h2><div class="muted">Tenant charges</div><div class="metric">'+money(wd)+'</div><p class="muted">Collected '+money(wp)+' · Balance '+money(wd-wp)+'</p></div></div><div class="card" style="margin-top:12px"><h2>Quick actions</h2><div class="actions"><button class="primary" id="addroom">+ Add room</button><button class="secondary" id="addtenant">+ Add tenant</button><button class="secondary" id="addbill">+ Water bill</button></div></div>';c.innerHTML+=expiryPanel();$('#addroom').onclick=roomForm;$('#addtenant').onclick=tenantForm;$('#addbill').onclick=billForm}
else if(section==='Rooms'){c.innerHTML='<div class="head"><div><h1>Rooms</h1><p class="muted">Create categories, then add physical rooms with their own rent and features.</p></div><div class="actions"><button class="primary" id="addcategory">+ Add room category</button><button class="secondary" id="addphysical">+ Add physical rooms</button></div></div><div class="card"><h2>Room categories</h2><p class="muted">Categories are labels only. Normal rent belongs to each physical room.</p>'+(d.roomTypes.length?'<div class="tablewrap"><table><tr><th>Category</th><th>Description</th><th>Rooms</th><th></th></tr>'+d.roomTypes.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+esc(t.description||'')+'</td><td>'+d.rooms.filter(r=>String(r.type).toLowerCase()===String(t.name).toLowerCase()).length+'</td><td><div class="actions" style="margin:0"><button class="secondary" data-edittype="'+t.id+'">Edit</button><button class="secondary" data-deletetype="'+t.id+'">Deactivate / delete</button></div></td></tr>').join('')+'</table></div>':'<div class="empty">No room types yet.</div>')+'</div><div class="card" style="margin-top:12px"><h2>Physical rooms and availability</h2>'+(d.rooms.length?'<div class="tablewrap"><table><tr><th>Room</th><th>Category</th><th>Normal monthly</th><th>Yearly estimate</th><th>Status</th><th>Actions</th></tr>'+d.rooms.map(r=>{let o=active().some(t=>String(t.room)===String(r.id));let price=+r.price||0;return '<tr><td>'+esc(r.number)+'</td><td>'+esc(r.type)+'</td><td>'+money(price)+'</td><td>'+money(price*12)+'</td><td><span class="pill '+(o?'':'away')+'">'+(o?'Occupied':'Vacant')+'</span></td><td><div class="actions" style="margin:0"><button class="secondary" data-editroom="'+r.id+'">Edit</button><button class="secondary" data-price="'+r.id+'">Change rent</button><button class="secondary" data-deleteroom="'+r.id+'">Deactivate / delete</button></div></td></tr>'}).join('')+'</table></div>':'<div class="empty">No physical rooms yet. Add a room type and quantity.</div>')+'</div>';$('#addcategory').onclick=roomForm;$('#addphysical').onclick=physicalRoomForm;document.querySelectorAll('[data-edittype]').forEach(b=>b.onclick=()=>editTypeForm(b.dataset.edittype));document.querySelectorAll('[data-deletetype]').forEach(b=>b.onclick=()=>deleteType(b.dataset.deletetype));document.querySelectorAll('[data-editroom]').forEach(b=>b.onclick=()=>editRoomForm(b.dataset.editroom));document.querySelectorAll('[data-price]').forEach(b=>b.onclick=()=>priceForm(b.dataset.price));document.querySelectorAll('[data-deleteroom]').forEach(b=>b.onclick=()=>deleteRoom(b.dataset.deleteroom))}
else if(section==='Tenants'){const current=d.tenancies.filter(t=>t.status==='active');c.innerHTML='<div class="head"><div><h1>Active Tenants</h1><p class="muted">Current occupancies. Ended tenancies are listed separately.</p></div><button class="primary" id="add">+ Add tenant</button></div><div class="card">'+(current.length?'<div class="tablewrap"><table><tr><th>Tenant</th><th>Room</th><th>Tenancy</th><th>Yearly rent</th><th></th></tr>'+current.map(t=>'<tr><td><button class="tenant-name-link" data-tenantdetails="'+t.tenant+'">'+esc(tn(t.tenant))+'</button><div class="muted">'+esc(t.code||'')+' · '+esc(t.phone||'')+'</div></td><td>'+esc(rn(t.room))+'<div class="muted">'+(t.arrangement==='family'?'Family · water only':'Rental')+'</div></td><td>'+esc(dateDisplay(t.start))+' – '+esc(dateDisplay(t.end))+'<br><span class="pill '+(t.status==='active'?'':'away')+'">'+esc(t.status)+'</span> '+(t.status==='active'?expiryBadge(t):'')+'</td><td>'+money(t.yearly)+'</td><td><div class="actions" style="margin:0"><button class="secondary" data-edittens="'+t.tenant+'">Edit tenant</button>'+(t.status==='active'?'<button class="secondary" data-end="'+t.id+'">End</button>':'')+'</div></td></tr>').join('')+'</table></div>':'<div class="empty">No tenants yet.</div>')+'</div>';$('#add').onclick=tenantForm;document.querySelectorAll('[data-tenantdetails]').forEach(b=>b.onclick=()=>tenantDetails(b.dataset.tenantdetails));document.querySelectorAll('[data-edittens]').forEach(b=>b.onclick=()=>editTenantForm(b.dataset.edittens));document.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>endTenancyForm(b.dataset.end))}
else if(section==='Ended Tenants'){const ended=d.tenancies.filter(t=>t.status==='ended');c.innerHTML='<h1>Ended Tenants</h1><p class="muted">Former tenancies remain here with their dates and financial history. The tenant profile and Tenant ID are retained if they return later.</p><div class="card">'+(ended.length?'<div class="tablewrap"><table><tr><th>Tenant</th><th>Room</th><th>Planned end</th><th>Actual move-out</th><th>Agreed monthly rent</th><th>Actions</th></tr>'+ended.map(t=>'<tr><td><button class="tenant-name-link" data-tenantdetails="'+t.tenant+'">'+esc(tn(t.tenant))+'</button><div class="muted">'+esc(t.code||'')+'</div></td><td>'+esc(rn(t.room))+'</td><td>'+esc(dateDisplay(t.end))+'</td><td>'+esc(dateDisplay(t.actualMoveOut||''))+'</td><td>'+money(t.monthly)+'</td><td><button class="secondary" data-tenantdetails="'+t.tenant+'">View history</button></td></tr>').join('')+'</table></div>':'<div class="empty">No ended tenancies yet.</div>')+'</div>';document.querySelectorAll('[data-tenantdetails]').forEach(b=>b.onclick=()=>tenantDetails(b.dataset.tenantdetails))}
else if(section==='Rent Tracking'){c.innerHTML='<div class="head"><div><h1>Rent Tracking</h1><p class="muted">Yearly periods and separate payment records.</p></div><button class="primary" id="add">+ Rent period</button></div><div class="card">'+(d.periods.length?'<div class="tablewrap"><table><tr><th>Tenant / period</th><th>Due</th><th>Paid</th><th>Balance</th><th>Elapsed</th><th></th></tr>'+d.periods.map(p=>{let t=d.tenancies.find(x=>String(x.id)===String(p.tenancy)),paid=sum(d.rentPayments,x=>String(x.period)===String(p.id)?+x.amount:0),span=new Date(p.end)-new Date(p.start),pct=span>0?Math.max(0,Math.min(100,(Date.now()-new Date(p.start))/span*100)):0;return '<tr><td>'+esc(t?tn(t.tenant):'—')+'<div class="muted">'+esc(dateDisplay(p.start))+' – '+esc(dateDisplay(p.end))+'</div></td><td>'+money(p.amount)+'</td><td>'+money(paid)+'</td><td>'+money(p.amount-paid)+'</td><td>'+Math.round(pct)+'%<div class="bar"><span style="width:'+pct+'%;display:block;background:#2d9b6b;height:7px"></span></div></td><td><button class="secondary" data-pay="'+p.id+'">Payment</button></td></tr>'}).join('')+'</table></div>':'<div class="empty">No rent periods yet. Add a period.</div>')+'</div>';$('#add').onclick=periodForm;document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>rentPay(b.dataset.pay))}
else if(section==='Water Bill'){c.innerHTML='<div class="head"><div><h1>Water Bill</h1><p class="muted">Monthly bill, household points, adjustments, payments and WhatsApp reports.</p></div><button class="primary" id="add">+ Monthly bill</button></div><div class="card">'+(d.bills.length?d.bills.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(b=>{let cs=d.charges.filter(x=>String(x.bill)===String(b.id)),due=sum(cs,x=>+x.final||0),paid=sum(d.waterPayments.filter(p=>cs.some(x=>String(x.id)===String(p.charge)||String(x.id)===String(p.chargeId))),p=>+p.amount||0);return '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="head" style="margin:0"><div><b>'+esc(b.month)+'</b><div class="muted">Actual '+money(b.actual)+' · rate/point '+money(b.rate)+'</div></div><div><b>'+money(due)+'</b><div class="muted">Charges · Collected '+money(paid)+' · Outstanding '+money(due-paid)+'</div></div></div><div class="actions"><button class="secondary" data-charge="'+b.id+'">Manage tenant charges</button><button class="secondary" data-waterreport="'+b.id+'">Generate WhatsApp list</button><button class="secondary" data-waterpayments="'+b.id+'">Record/view payments</button></div></div>'}).join(''):'<div class="empty">No water bills yet.</div>')+'</div>';$('#add').onclick=billForm;document.querySelectorAll('[data-charge]').forEach(b=>b.onclick=()=>chargeForm(b.dataset.charge));document.querySelectorAll('[data-waterreport]').forEach(b=>b.onclick=()=>waterReport(b.dataset.waterreport));document.querySelectorAll('[data-waterpayments]').forEach(b=>b.onclick=()=>waterPaymentList(b.dataset.waterpayments))}
}
function endTenancyForm(id){const t=d.tenancies.find(x=>String(x.id)===String(id));if(!t||t.status!=='active')return;showModal('End tenancy / move out','<form><div class="card"><b>'+esc(tn(t.tenant))+'</b><p class="muted">Room '+esc(rn(t.room))+' · Planned end date '+esc(dateDisplay(t.end))+'</p><p class="muted">Any unpaid rent or water charges will remain linked to this tenancy.</p></div><div class="field" style="margin-top:12px"><label>Actual move-out date *</label><input name="actualMoveOut" type="date" value="'+today()+'" required></div>'+errHtml()+'<div class="actions"><button class="primary">Confirm move-out</button></div></form>',x=>{if(!x.actualMoveOut)throw Error('Choose the actual move-out date.');t.status='ended';t.actualMoveOut=x.actualMoveOut;t.endedAt=x.actualMoveOut})}
function editRentPayment(id){const p=d.rentPayments.find(x=>String(x.id)===String(id));if(!p)return;showModal('Edit rent payment','<form><div class="field"><label>Amount (GH₵) *</label><input name="amount" type="number" min=".01" step=".01" value="'+p.amount+'" required></div><div class="field" style="margin-top:10px"><label>Date *</label><input name="date" type="date" value="'+esc(p.date||today())+'" required></div><div class="field" style="margin-top:10px"><label>Receipt / reference (optional)</label><input name="receipt" value="'+esc(p.receipt||'')+'"></div><div class="field" style="margin-top:10px"><label>Payment method *</label><select name="method" required><option value="cash" '+(p.method==='cash'?'selected':'')+'>Cash</option><option value="momo" '+(p.method==='momo'?'selected':'')+'>Mobile Money (MoMo)</option><option value="bank" '+(p.method==='bank'?'selected':'')+'>Bank transfer</option><option value="other" '+(p.method==='other'?'selected':'')+'>Other</option></select></div>'+errHtml()+'<div class="actions"><button class="primary">Save changes</button><button type="button" class="secondary" id="deleteRentPayment">Delete payment</button></div></form>',x=>{if(+x.amount<=0)throw Error('Payment must be greater than zero.');p.amount=+x.amount;p.date=x.date;p.receipt=(x.receipt||"").trim();p.method=x.method});const b=$('#deleteRentPayment');if(b)b.onclick=()=>{if(safeDeleteLinked('this rent payment')){d.rentPayments=d.rentPayments.filter(x=>String(x.id)!==String(id));save();closeModal();render()}}}
function showModal(title,html,fn){$('#mt').textContent=title;$('#mb').innerHTML=html;$('#modal').classList.add('show');const form=$('#mb form');if(form)form.onsubmit=async e=>{e.preventDefault();const submit=form.querySelector('button[type="submit"],button:not([type])');if(submit)submit.disabled=true;try{await fn(Object.fromEntries(new FormData(e.target)));save();closeModal();render()}catch(err){const out=$('#modalerr');if(out)out.textContent=err.message;else alert(err.message);if(submit)submit.disabled=false}}}
async function compressTenancyPhotos(files){if(!files||!files.length)return [];if(files.length>3)throw Error('Choose up to 3 photos for this tenancy.');const out=[];for(const file of files){if(!file.type||!file.type.startsWith('image/'))throw Error('Only image files are supported.');if(file.size>12*1024*1024)throw Error('Each photo must be 12 MB or smaller.');let bitmap;try{bitmap=await createImageBitmap(file)}catch(e){throw Error('One photo could not be opened. Try another image.')}const scale=Math.min(1,1000/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();out.push({name:String(file.name||'Tenancy photo').slice(0,120),data:canvas.toDataURL('image/jpeg',.65),addedAt:today()})}return out}

function physicalRoomForm(){

 showModal('Add physical rooms','<form><div class="formgrid"><div class="field full"><label>Choose existing room category *</label><select name="type" required>'+d.roomTypes.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select></div><div class="field"><label>How many physical rooms to create? *</label><input name="qty" type="number" min="1" step="1" value="1" required></div><div class="field"><label>Normal monthly rent (GH₵) *</label><input name="price" type="number" min="0" step=".01" value="'+((d.roomTypes.find(t=>String(t.id)===String(d.roomTypes[0]?.id))||{}).price||0)+'" required></div><div class="field full"><label>Room features (optional)</label><input name="features" placeholder="e.g. Washroom, kitchen, balcony"></div><div class="field full"><label>Room description (optional)</label><input name="description" placeholder="Extra details about these rooms"></div></div><p class="muted">HousePilot assigns the next number automatically. Single Room categories share one sequence; all Chamber & Hall categories share one sequence. Each room is created as a separate record.</p>'+errHtml()+'<div class="actions"><button class="primary">Create rooms</button></div></form>',x=>{
 const rt=d.roomTypes.find(t=>String(t.id)===String(x.type)),qty=Math.floor(+x.qty),price=Number(x.price);if(!rt)throw Error('Choose a room category.');if(qty<1)throw Error('Enter at least one physical room.');if(!(price>=0))throw Error('Enter a valid normal monthly rent.');
 const group=roomGroup(rt.category||rt.name),existing=d.rooms.filter(r=>roomGroup(r.category||r.type)===group);
 let seq=existing.reduce((m,r)=>Math.max(m,Number((String(r.number||'').match(/(\d+)\s*$/)||[])[1])||0),0)+1;
 for(let i=0;i<qty;i++){d.rooms.push({id:next(d.rooms),number:(rt.category||rt.name)+' '+seq,type:rt.name,category:rt.category||rt.name,description:x.description.trim(),features:x.features.trim(),price,active:true,priceHistory:[{date:today(),price}]});seq++}
 });

function editRoomForm(id){

function deleteRoom(id){

function tenantDetails(id){
 const person=d.tenants.find(x=>String(x.id)===String(id));if(!person)return;
 const tenancies=d.tenancies.filter(t=>String(t.tenant)===String(id));
 const moneyCell=n=>money(Number(n)||0);
 const periodRows=tenancies.flatMap(t=>d.periods.filter(p=>String(p.tenancy)===String(t.id)).map(p=>({p,t})));
 const paidAll=sum(d.rentPayments,p=>periodRows.some(z=>String(z.p.id)===String(p.period))?(+p.amount||0):0);
 const dueAll=sum(periodRows,z=>+z.p.amount||0);
 const waterRows=d.charges.filter(c=>tenancies.some(t=>String(t.id)===String(c.tenancy)));
 const waterDue=sum(waterRows,c=>+c.final||0);
 const waterPaid=sum(d.waterPayments,p=>waterRows.some(c=>String(c.id)===String(p.charge)||String(c.id)===String(p.chargeId))?(+p.amount||0):0);
 const tenancyCards=tenancies.map(t=>{
  const room=d.rooms.find(r=>String(r.id)===String(t.room));
  const rt=room&&d.roomTypes.find(x=>String(x.name).toLowerCase()===String(room.type).toLowerCase());
  const start=new Date((t.start||today())+'T00:00:00'),end=new Date((t.end||today())+'T23:59:59'),now=new Date();
  const total=end-start,elapsed=now-start,pct=total>0?Math.max(0,Math.min(100,elapsed/total*100)):0;
  const periods=d.periods.filter(p=>String(p.tenancy)===String(t.id));
  const rows=periods.map(p=>{
   const pays=d.rentPayments.filter(x=>String(x.period)===String(p.id));
   const paid=sum(pays,x=>+x.amount||0);
   return '<div class="card" style="margin-top:9px"><b>Rent period: '+esc(dateDisplay(p.start))+' – '+esc(dateDisplay(p.end))+'</b><p class="muted">Due '+moneyCell(p.amount)+' · Paid '+moneyCell(paid)+' · Balance '+moneyCell((+p.amount||0)-paid)+'</p>'+(pays.length?'<div class="muted">'+pays.map(x=>'Payment '+moneyCell(x.amount)+' · '+esc(dateDisplay(x.date||''))+' · Receipt '+esc(x.receipt||'—')+' <button class="secondary" data-edit-rentpay="'+x.id+'">Edit</button> <button class="secondary" data-del-rentpay="'+x.id+'">Delete</button>').join('<br>')+'</div>':'<div class="muted">No payments recorded for this period.</div>')+'</div>';
  }).join('');
  const water=waterRows.filter(c=>String(c.tenancy)===String(t.id));
  return '<div class="card" style="margin-top:12px"><h2>'+esc(room?room.number:'Room unavailable')+' · '+esc(room?room.type:'')+'</h2><div class="muted">Tenancy '+esc(t.status||'unknown')+' · '+(t.arrangement==='family'?'Family — water only':'Rental')+'</div><p>Start: <b>'+esc(dateDisplay(t.start))+'</b><br>End: <b>'+esc(dateDisplay(t.end))+'</b><br>Monthly rent: <b>'+moneyCell(t.monthly)+'</b> · Yearly rent: <b>'+moneyCell(t.yearly)+'</b><br>Water points: <b>'+esc(t.points??0)+'</b></p>'+(t.arrangementPhotos&&t.arrangementPhotos.length?'<h2>Tenancy arrangement photos ('+t.arrangementPhotos.length+')</h2><div class="two">'+t.arrangementPhotos.map(p=>'<div><a href="'+p.data+'" target="_blank" rel="noopener"><img src="'+p.data+'" alt="Tenancy arrangement form" style="width:100%;max-height:260px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#f3f6f4"></a><div class="muted">'+esc(p.name||'Tenancy photo')+' · '+esc(dateDisplay(p.addedAt||''))+'</div></div>').join('')+'</div>':'<p class="muted">No arrangement photos saved for this tenancy.</p>')+'<div class="muted" style="margin-bottom:6px">Rental period progress · '+Math.round(pct)+'% elapsed</div><div class="hp-track-bg"><div class="hp-track-fill" style="--hp-progress:'+pct+'%"></div></div><div class="muted" style="margin-top:6px">Progress is based on the tenancy dates, not on whether rent has been paid.</div><h2 style="margin-top:16px">Rent periods and payments</h2>'+(rows||'<p class="muted">No rent periods recorded for this tenancy.</p>')+'<h2 style="margin-top:16px">Water charges</h2>'+(water.length?water.map(c=>{const bill=d.bills.find(b=>String(b.id)===String(c.bill));return '<div class="muted" style="padding:6px 0;border-bottom:1px solid var(--line)">'+esc(bill?bill.month:'Water bill')+' · Charge '+moneyCell(c.final)+' · Points '+esc(c.points??0)+'</div>'}).join(''):'<p class="muted">No water charges recorded for this tenancy.</p>')+'</div>';
 }).join('');
 const tenantHistory=tenancies.length;
 showModal('Tenant details','<div class="card"><h2>'+esc(person.name)+'</h2><p class="muted">Tenant ID: '+esc(person.code||('HP-'+person.id))+'</p><p>Phone: <b>'+esc(person.phone||'Not provided')+'</b><br>Second phone: <b>'+esc(person.phone2||'Not provided')+'</b><br>Occupation: <b>'+esc(person.occupation||'Not provided')+'</b><br>Gender: <b>'+esc(person.gender||'Not provided')+'</b><br>Marital status: <b>'+esc(person.marital||'Not provided')+'</b><br>Emergency contact: <b>'+esc(person.emergencyName||'Not provided')+' · '+esc(person.emergencyPhone||'Not provided')+'</b></p><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px"><div class="card"><div class="muted">Rent due</div><b>'+moneyCell(dueAll)+'</b></div><div class="card"><div class="muted">Rent paid</div><b>'+moneyCell(paidAll)+'</b></div><div class="card"><div class="muted">Rent balance</div><b>'+moneyCell(dueAll-paidAll)+'</b></div><div class="card"><div class="muted">Water charges</div><b>'+moneyCell(waterDue)+'</b></div></div><div class="actions"><button class="primary" id="profileEdit">Edit tenant details</button></div></div><h2 style="margin-top:16px">Tenancy history ('+tenantHistory+')</h2>'+(tenancyCards||'<div class="empty">No tenancy records found.</div>')+'<div class="actions"><button class="secondary" onclick="closeModal()">Close details</button></div>',()=>{});
 const edit=$('#profileEdit');if(edit)edit.onclick=()=>{closeModal();editTenantForm(id)};
 document.querySelectorAll('[data-edit-rentpay]').forEach(b=>b.onclick=()=>editRentPayment(b.dataset.editRentpay));
 document.querySelectorAll('[data-del-rentpay]').forEach(b=>b.onclick=()=>{const pid=b.dataset.delRentpay;if(safeDeleteLinked('this rent payment')){d.rentPayments=d.rentPayments.filter(x=>String(x.id)!==String(pid));save();tenantDetails(id)}});
}

function tenantForm(){
 let free=d.rooms.filter(r=>!active().some(t=>String(t.room)===String(r.id)));
 if(!free.length){alert('There are no vacant rooms. Add physical rooms or end a tenancy first.');return}
 showModal('Register tenant','<form><div class="formgrid"><div class="field full"><label>Full name *</label><input name="name" required></div><div class="field"><label>Phone *</label><input name="phone" type="tel" required></div><div class="field"><label>Second phone (optional)</label><input name="phone2" type="tel"></div><div class="field"><label>Occupation</label><input name="occupation" placeholder="e.g. Teacher, trader"></div><div class="field"><label>Gender</label><select name="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Prefer not to say</option></select></div><div class="field"><label>Marital status</label><select name="marital"><option value="">Select</option><option value="single">Single</option><option value="married">Married</option></select></div><div class="field"><label>Emergency contact name (optional)</label><input name="emergencyName"></div><div class="field"><label>Emergency contact phone (optional)</label><input name="emergencyPhone" type="tel"></div><div class="field"><label>Available room *</label><select name="room">'+free.map(r=>'<option value="'+r.id+'">'+esc(r.number)+' — '+esc(r.type)+'</option>').join('')+'</select></div><div class="field"><label>Start date *</label><input name="start" type="date" value="'+today()+'" required></div><div class="field"><label>Tenancy duration *</label><select name="years"><option value="1">1 year</option><option value="2">2 years</option><option value="3">3 years</option><option value="4">4 years</option><option value="5">5 years</option></select></div><div class="field"><label>Automatically calculated end date</label><input id="tenantEnd" readonly></div><div class="field"><label>Normal monthly rent (GH₵)</label><input id="tenantMonthly" readonly></div><div class="field"><label>Agreed monthly rent (GH₵)</label><input name="agreedMonthly" id="tenantAgreedMonthly" type="number" min="0" step=".01" placeholder="Use normal rent"></div><div class="field"><label>Total rent for duration (GH₵)</label><input id="tenantTotal" readonly></div><div class="field full"><label>Occupancy arrangement</label><select name="arrangement"><option value="rental">Paying tenant</option><option value="family">Family — no rent, water only</option></select></div><div class="field full"><label>Starting water points *</label><input name="points" type="number" min="0" step=".01" value="1" required><small class="muted">This is the starting/default value. Points can be changed separately for each monthly water bill; old months must keep their saved points.</small></div><div class="field full"><label>Tenancy arrangement form photos (optional)</label><input name="arrangementPhotos" id="arrangementPhotos" type="file" accept="image/*" capture="environment" multiple><small class="muted">Choose or take up to 3 photos. HousePilot resizes and compresses them before saving. Photos belong to this tenancy and stay in this browser on this device.</small></div></div>'+errHtml()+'<div class="actions"><button class="primary">Save tenant</button></div></form>',x=>{
 let room=d.rooms.find(r=>String(r.id)===String(x.room));if(!room)throw Error('Please select a room.');
 if(active().some(t=>String(t.room)===String(room.id)))throw Error('That room is already occupied.');
 if(!x.start)throw Error('Choose a start date.');
 const years=Number(x.years);if(!(years>0))throw Error('Choose a valid duration.');

function waterPaymentList(id){let b=d.bills.find(x=>String(x.id)===String(id));if(!b)return;let cs=d.charges.filter(c=>String(c.bill)===String(id));if(!cs.length){alert('First open Manage tenant charges and save this month\'s charges.');return}showModal('Water payments — '+b.month,cs.map(c=>{let paid=waterPaid(c),bal=Math.max(0,(+c.final||0)-paid),history=waterPaymentsFor(c);return '<div class=\"card\" style=\"margin:9px 0\"><b>'+esc(tn(c.tenant))+' — Room '+esc(rn((d.tenancies.find(t=>String(t.id)===String(c.tenancy))||{}).room))+'</b><p class=\"muted\">Charge '+money(c.final)+' · Paid '+money(paid)+' · Balance '+money(bal)+'</p>'+(history.length?'<div class=\"muted\">'+history.map(p=>esc(dateDisplay(p.date||''))+' · '+money(p.amount)+(p.receipt?' · Ref '+esc(p.receipt):'')+' <button class="secondary" data-edit-waterpay="'+p.id+'">Edit</button> <button class="secondary" data-del-waterpay="'+p.id+'">Delete</button>').join('<br>')+'</div>':'<div class=\"muted\">No payments recorded.</div>')+(bal>0?'<div class=\"actions\"><button class=\"primary\" data-waterpay=\"'+c.id+'\">Record payment</button></div>':'<p class=\"pill\">Fully paid</p>')+'</div>'}).join('')+'<div class=\"actions\"><button class=\"secondary\" onclick=\"closeModal()\">Close</button></div>',()=>{});document.querySelectorAll('[data-waterpay]').forEach(btn=>btn.onclick=()=>{closeModal();waterPaymentForm(btn.dataset.waterpay)});

function billForm(){showModal('Add monthly water bill','<form><div class="formgrid"><div class="field"><label>Bill month *</label><input name="month" type="month" value="'+today().slice(0,7)+'" required></div><div class="field"><label>Actual bill (GH₵) *</label><input name="actual" type="number" min="0" step=".01" required></div></div>'+errHtml()+'<div class="actions"><button class="primary">Save bill</button></div></form>',x=>{if(d.bills.some(b=>b.month===x.month))throw Error('Bill for this month already exists.');let total=sum(active(),t=>+t.points||0),actual=+x.actual;d.bills.push({id:next(d.bills),month:x.month,actual,total,rate:total?Math.ceil(actual/total):0})})}
function chargeForm(n){let b=d.bills.find(x=>String(x.id)===String(n)),ts=active();if(!ts.length){alert('Register an active tenant first.');return}showModal('Manage monthly water charges','<p class="muted">Rate per point: '+money(b.rate)+'. Away means zero points/charge for this month. Points can change each month; saved months stay separate.</p><form>'+ts.map(t=>{let old=d.charges.find(c=>String(c.bill)===String(n)&&String(c.tenancy)===String(t.id));return '<div class="card" style="margin:9px 0"><b>'+esc(tn(t.tenant))+' — '+esc(rn(t.room))+'</b><div class="formgrid" style="margin-top:9px"><div class="field"><label>Attendance</label><select name="a'+t.id+'"><option value="present" '+(old?.attendance!=='away'?'selected':'')+'>Present</option><option value="away" '+(old?.attendance==='away'?'selected':'')+'>Away</option></select></div><div class="field"><label>Points</label><input name="p'+t.id+'" type="number" min="0" step=".01" value="'+(old?.points??t.points)+'"></div><div class="field"><label>Adjustment (+/-)</label><input name="x'+t.id+'" type="number" step=".01" value="'+(old?.adjustment??0)+'"></div><div class="field"><label>Final charge override</label><input name="f'+t.id+'" type="number" min="0" step=".01" value="'+(old?.override??'')+'" placeholder="Auto"></div></div><div class="muted">Household point guide: adult = 1 point; each complete pair of children under 12 = 1 point; each child aged 12+ = 1 point. Enter the calculated points for this month.</div></div>'}).join('')+errHtml()+'<div class="actions"><button class="primary">Save charges</button></div></form>',x=>{for(const t of ts){let attendance=x['a'+t.id],points=attendance==='away'?0:(+x['p'+t.id]||0),calc=points*b.rate,adjustment=+x['x'+t.id]||0,override=x['f'+t.id],final=override!==''?+override:Math.max(0,calc+adjustment);if(final<0)throw Error('Charge cannot be negative.');let old=d.charges.find(c=>String(c.bill)===String(n)&&String(c.tenancy)===String(t.id)),o={id:old?old.id:next(d.charges),bill:+n,tenancy:t.id,tenant:t.tenant,attendance,points,calc,adjustment,override,final};if(old)Object.assign(old,o);else d.charges.push(o)}})}
function waterPaymentsFor(charge){return d.waterPayments.filter(p=>String(p.charge)===String(charge.id)||String(p.chargeId)===String(charge.id))}
