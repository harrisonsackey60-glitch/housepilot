/* HOUSEPILOT PREMIUM LIGHT REDESIGN */
:root{--g:#b88b32;--ink:#292824;--muted:#858078;--line:#e9e4dc;--bg:#f1efeb;color-scheme:light}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;letter-spacing:-.012em}
button{border-radius:14px;font-weight:700;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
button:active{transform:scale(.98)}
.primary{background:#d6ae59;color:#29251d;box-shadow:0 4px 12px #b88b321c}
.secondary{background:#f4ead3;color:#74551e}
header{background:#f8f6f2;color:#292824;padding:15px 20px;border-bottom:1px solid #e8e3db;box-shadow:0 3px 18px #4b40300a}

.wrap{max-width:1120px;padding:20px}

.card{background:#fff;border:1px solid #eae6df;border-radius:22px;padding:19px;box-shadow:0 5px 20px #40352208}

.tablewrap{border:1px solid #eee9e1;border-radius:17px;background:#fff}
table{font-size:13px}
th{background:#faf8f4;color:#817a70;font-weight:750}
th,td{padding:13px 12px;border-bottom:1px solid #f0ece6}

.pill{background:#f5ecd9;color:#785b26;border-radius:30px;padding:5px 10px;font-weight:750}
.away{background:#fff0df;color:#986321}
.tenant-name-link{color:#806022;text-decoration:none}

@media(min-width:700px){.room-mini-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.room-mini-card{padding:14px}.room-mini-name{font-size:17px}}

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),today=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')},money=n=>new Intl.NumberFormat('en-GH',{style:'currency',currency:'GHS'}).format(Number(n||0)),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empty=()=>({roomTypes:[],rooms:[],tenants:[],tenancies:[],periods:[],rentPayments:[],bills:[],charges:[],waterPayments:[]});
let d,section='Dashboard';
function roomPriceAt(room,asOf=today()){if(!room)return 0;const history=Array.isArray(room.priceHistory)?room.priceHistory:[];const eligible=history.filter(h=>!h.date||String(h.date)<=asOf).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));return eligible.length?Math.max(0,Number(eligible[eligible.length-1].price)||0):Math.max(0,Number(room.price)||0)}
 function load(){
  const saved=localStorage.getItem('hp-data');
  if(saved===null){d=empty()}
  else{try{d=JSON.parse(saved)}catch(e){throw Error('HousePilot found saved property data but could not read its format. Your saved data has been left untouched. Please contact support before trying to reset anything.')}}
  if(!d||typeof d!=='object'||Array.isArray(d))throw Error('HousePilot found saved property data in an unexpected format. Your saved data has been left untouched.');
  d.roomTypes=Array.isArray(d.roomTypes)?d.roomTypes:[];
  d.rooms=Array.isArray(d.rooms)?d.rooms:[];
  d.tenants=Array.isArray(d.tenants)?d.tenants:[];
  d.tenancies=Array.isArray(d.tenancies)?d.tenancies:[];
  d.tenancies.forEach(t=>{if(t&&typeof t==='object'&&t.points==null)t.points=1});
  d.periods=Array.isArray(d.periods)?d.periods:[];
  d.rentPayments=Array.isArray(d.rentPayments)?d.rentPayments:[];
  d.bills=Array.isArray(d.bills)?d.bills:[];
  d.charges=Array.isArray(d.charges)?d.charges:[];
  d.waterPayments=Array.isArray(d.waterPayments)?d.waterPayments:[];
  d.rooms.forEach(r=>{if(!r||typeof r!=='object')return;const typeName=String(r.type||'').toLowerCase();if(!d.roomTypes.some(t=>t&&String(t.name||'').toLowerCase()===typeName))d.roomTypes.push({id:next(d.roomTypes),name:r.type||'Single Room',price:+r.price||0});if(Array.isArray(r.priceHistory)&&r.priceHistory.length)r.price=roomPriceAt(r,today())})
}
function save(){try{localStorage.setItem('hp-data',JSON.stringify(d))}catch(e){if(e&&(/quota|storage/i.test(String(e.name||'')+' '+String(e.message||''))))throw Error('HousePilot could not save because this browser may be running out of local storage. Your existing saved records have not been intentionally cleared. Close the form and avoid refreshing until you have freed browser storage or reduced the size of new photos.');throw e}}
function login(){
 function showLogin(recovery=false){
  if(recovery){
   $('#app').innerHTML='<div class="login"><div class="loginbox"><div class="brand">HousePilot<small>PROPERTY RECORDS</small></div><h1 style="margin-top:22px">Recover passcode</h1><p class="muted">Enter your recovery code, then choose a new passcode.</p><form id="rf"><input id="recoveryCode" required placeholder="Recovery code" autocomplete="off"><input id="newPass" type="password" required minlength="4" placeholder="New passcode" inputmode="numeric"><input id="newPass2" type="password" required minlength="4" placeholder="Confirm new passcode" inputmode="numeric"><button class="primary">Reset passcode</button></form><button class="secondary" style="width:100%;margin-top:10px" id="backLogin">Back to login</button><div id="err" class="status"></div></div></div>';
   $('#backLogin').onclick=()=>showLogin(false);
   $('#rf').onsubmit=e=>{e.preventDefault();const code=$('#recoveryCode').value.trim(),stored=localStorage.getItem('hp-recovery'),p=$('#newPass').value;if(!stored||code!==stored){$('#err').textContent='The recovery code is incorrect. Your records have not been changed.';return}if(p!==$('#newPass2').value){$('#err').textContent='The new passcodes do not match.';return}localStorage.setItem('hp-pass',p);showLogin(false);};
   return;
  }
  const first=!localStorage.getItem('hp-pass');
  $('#app').innerHTML='<div class="login"><div class="loginbox"><div class="brand">HousePilot<small>PROPERTY RECORDS</small></div><h1 style="margin-top:22px">'+(first?'Create your passcode':'Welcome back')+'</h1><p class="muted">'+(first?'Choose a passcode and a recovery code. Keep the recovery code somewhere safe.':'Enter your passcode to open HousePilot.')+'</p><form id="lf"><input id="pw" type="password" required minlength="4" placeholder="'+(first?'Create passcode':'Passcode')+'" inputmode="numeric" autocomplete="'+(first?'new-password':'current-password')+'">'+(first?'<input id="pw2" type="password" required minlength="4" placeholder="Confirm passcode" inputmode="numeric" autocomplete="new-password"><input id="recoverySetup" required minlength="6" placeholder="Create recovery code (at least 6 characters)" autocomplete="off"><input id="recoverySetup2" required minlength="6" placeholder="Confirm recovery code" autocomplete="off"><p class="muted">Write down your recovery code. You need it if you forget your passcode.</p>':'')+'<button class="primary">'+(first?'Create passcode and unlock':'Unlock HousePilot')+'</button></form>'+(first?'':'<button class="secondary" style="width:100%;margin-top:10px" id="forgotPass">Forgot passcode?</button>')+'<p class="muted">Local mode: records and recovery details are saved in this browser on this device only. Recovery will not work if browser site data is erased or you switch devices.</p><div id="err" class="status"></div></div></div>';
  if(!first)$('#forgotPass').onclick=()=>showLogin(true);
  $('#lf').onsubmit=e=>{e.preventDefault();const p=$('#pw').value;if(first){const code=$('#recoverySetup').value.trim();if(p!==$('#pw2').value){$('#err').textContent='The passcodes do not match.';return}if(code.length<6||code!==$('#recoverySetup2').value.trim()){$('#err').textContent='The recovery codes must match and contain at least 6 characters.';return}localStorage.setItem('hp-pass',p);localStorage.setItem('hp-recovery',code);alert('Passcode created. Keep your recovery code safe: '+code)}else if(p!==localStorage.getItem('hp-pass')){$('#err').textContent='Incorrect passcode. Try again.';return}sessionStorage.setItem('hp-open','1');load();shell()};
 }
 showLogin(false);
}

function editWaterBillForm(id){const b=d.bills.find(x=>String(x.id)===String(id));if(!b)return;const charges=d.charges.filter(c=>String(c.bill)===String(id));if(charges.some(c=>waterPaid(c)>0)){alert('This bill has recorded water payments. The bill amount is locked to protect payment history. You can still edit the tenant name shown on each charge in Manage charges.');return}const currentMonth=waterMonthKey(b.month);showModal('Edit monthly water bill','<form><div class="field"><label>Bill month (month this water bill is for) *</label><input name="month" type="month" value="'+esc(currentMonth)+'" required><p class="muted">Use the month the water was used/billed, not the month you collect payment. For example, the September water bill stays September even if tenants pay it in October.</p></div><div class="field"><label>Actual bill (GH₵) *</label><input name="actual" type="number" min="0" step=".01" value="'+Number(b.actual||0)+'" required></div>'+errHtml()+'<div class="actions"><button class="primary">Save bill changes</button></div></form>',x=>{const actual=Number(x.actual),month=waterMonthKey(x.month);if(!month)throw Error('Choose a valid bill month.');if(d.bills.some(other=>String(other.id)!==String(b.id)&&waterMonthKey(other.month)===month))throw Error('A water bill already exists for '+month+'.');if(!Number.isFinite(actual)||actual<0)throw Error('Enter a valid bill amount.');b.month=month;b.actual=Math.round(actual*100)/100;const points=sum(charges,c=>c.attendance==='away'?0:Math.max(0,Number(c.points)||0));b.total=points;b.rate=points?Math.ceil(b.actual/points):0;b.zeroPoints=points===0;b.ratePendingReview=points===0;for(const c of charges){c.calc=(c.attendance==='away'?0:Math.max(0,Number(c.points)||0))*b.rate;c.final=c.override!==''&&c.override!=null?Number(c.override):Math.max(0,c.calc+(Number(c.adjustment)||0))}})}
function deleteWaterBill(id){const b=d.bills.find(x=>String(x.id)===String(id));if(!b)return;const charges=d.charges.filter(c=>String(c.bill)===String(id));if(charges.some(c=>waterPaid(c)>0)){alert('This bill has recorded payments. Delete or correct the individual payment records first; the bill is protected to preserve payment history.');return}if(!confirm('Delete the water bill for '+b.month+' and its saved monthly charges? This cannot be undone.'))return;const ids=new Set(charges.map(c=>String(c.id)));d.waterPayments=d.waterPayments.filter(p=>!ids.has(String(p.charge))&&!ids.has(String(p.chargeId)));d.charges=d.charges.filter(c=>String(c.bill)!==String(id));d.bills=d.bills.filter(x=>String(x.id)!==String(id));save();render()}
function billForm(){showModal('Add monthly water bill','<form><div class="formgrid"><div class="field"><label>Bill month *</label><input name="month" type="month" value="'+today().slice(0,7)+'" required></div><div class="field"><label>Actual bill (GH₵) *</label><input name="actual" type="number" min="0" step=".01" required></div></div><p class="muted">The rate per point is rounded up to the next whole Ghana cedi. If total points are zero, HousePilot will flag the bill and leave the rate at zero.</p>'+errHtml()+'<div class="actions"><button class="primary">Save bill</button></div></form>',x=>{if(!x.month)throw Error('Choose the bill month.');if(d.bills.some(b=>b.month===x.month))throw Error('Bill for this month already exists.');let total=sum(active(),t=>Math.max(0,Number(t.points)||0)),actual=Number(x.actual);if(!Number.isFinite(actual)||actual<0)throw Error('Enter a valid actual water bill amount.');d.bills.push({id:next(d.bills),month:x.month,actual:Math.round(actual*100)/100,total,rate:total?Math.ceil(actual/total):0,zeroPoints:total===0,ratePendingReview:true})})}
function chargeForm(n){let b=d.bills.find(x=>String(x.id)===String(n)),ts=active();if(!b)return;if(!ts.length){alert('Register an active tenant first.');return}if(d.charges.some(c=>String(c.bill)===String(n)&&waterPaid(c)>0)){alert('This month has recorded water payments. Its saved charges and points are locked to protect historical records.');return}showModal('Manage monthly water charges','<p class="muted">Enter each household’s points for this month first. HousePilot recalculates the rate from these monthly points, rounding up to the next whole cedi. Away means zero points/charge for this month. Saved months stay separate.</p><form>'+ts.map(t=>{let old=d.charges.find(c=>String(c.bill)===String(n)&&String(c.tenancy)===String(t.id));return '<div class="card" style="margin:9px 0"><b>'+esc(tn(t.tenant))+' — '+esc(rn(t.room))+'</b><div class="field" style="margin-top:9px"><label>Name to show on this water bill (optional)</label><input name="n'+t.id+'" value="'+esc(old?.billName||'')+'" placeholder="'+esc(tn(t.tenant))+'"></div><p class="muted">This changes only the name printed on this month’s water bill, not the tenant’s official profile.</p><div class="formgrid" style="margin-top:9px"><div class="field"><label>Attendance</label><select name="a'+t.id+'"><option value="present" '+(old?.attendance!=='away'?'selected':'')+'>Present</option><option value="away" '+(old?.attendance==='away'?'selected':'')+'>Away</option></select></div><div class="field"><label>Points</label><input name="p'+t.id+'" type="number" min="0" step=".01" value="'+(old?.points??t.points)+'"></div><div class="field"><label>Adjustment (+/-)</label><input name="x'+t.id+'" type="number" step=".01" value="'+(old?.adjustment??0)+'"></div><div class="field"><label>Final charge override</label><input name="f'+t.id+'" type="number" min="0" step=".01" value="'+(old?.override??'')+'" placeholder="Auto"></div></div><div class="muted">Household point guide: adult = 1 point; each complete pair of children under 12 = 1 point; each child aged 12+ = 1 point. Enter the calculated points for this month.</div></div>'}).join('')+errHtml()+'<div class="actions"><button class="primary">Save charges</button></div></form>',x=>{const rows=ts.map(t=>{let attendance=x['a'+t.id],rawPoints=Number(x['p'+t.id]),points=attendance==='away'?0:rawPoints,adjustment=Number(x['x'+t.id]||0),override=x['f'+t.id];if(!Number.isFinite(rawPoints)||rawPoints<0)throw Error('Points must be zero or greater for '+tn(t.tenant)+'.');if(!Number.isFinite(adjustment))throw Error('Enter a valid adjustment for '+tn(t.tenant)+'.');if(override!==''&&(!Number.isFinite(Number(override))||Number(override)<0))throw Error('Charge override must be zero or greater for '+tn(t.tenant)+'.');return {t,attendance,points,adjustment,override,billName:(x['n'+t.id]||'').trim()}});const total=rows.reduce((v,r)=>v+r.points,0);if(!(total>0))throw Error('Total monthly points are zero. Enter points for at least one household before calculating charges.');const rate=Math.ceil((Number(b.actual)||0)/total);b.total=total;b.rate=rate;b.zeroPoints=false;b.ratePendingReview=false;for(const r of rows){const {t,attendance,points,adjustment,override,billName}=r,calc=points*rate,final=override!==''?Number(override):Math.max(0,calc+adjustment),old=d.charges.find(c=>String(c.bill)===String(n)&&String(c.tenancy)===String(t.id)),o={id:old?old.id:next(d.charges),bill:+n,tenancy:t.id,tenant:t.tenant,billName:billName||'',attendance,points,calc,adjustment,override,final};if(old)Object.assign(old,o);else d.charges.push(o)}})}
function waterPaymentsFor(charge){return d.waterPayments.filter(p=>String(p.charge)===String(charge.id)||String(p.chargeId)===String(charge.id))}
function waterPaid(charge){return sum(waterPaymentsFor(charge),p=>+p.amount||0)}
function editWaterPayment(id){let p=d.waterPayments.find(x=>String(x.id)===String(id));if(!p)return;showModal('Edit water payment','<form><div class="formgrid"><div class="field"><label>Amount (GH₵) *</label><input name="amount" type="number" min=".01" step=".01" value="'+p.amount+'" required></div><div class="field"><label>Payment date *</label><input name="date" type="date" value="'+esc(p.date||today())+'" required></div><div class="field full"><label>Receipt / reference (optional)</label><input name="receipt" value="'+esc(p.receipt||'')+'"></div><div class="field full"><label>Payment method *</label><select name="method" required><option value="cash" '+(p.method==='cash'?'selected':'')+'>Cash</option><option value="momo" '+(p.method==='momo'?'selected':'')+'>Mobile Money (MoMo)</option><option value="bank" '+(p.method==='bank'?'selected':'')+'>Bank transfer</option><option value="other" '+(p.method==='other'?'selected':'')+'>Other</option></select></div></div>'+errHtml()+'<div class="actions"><button class="primary">Save changes</button><button type="button" class="secondary" id="deleteWaterPayment">Delete payment</button></div></form>',x=>{const amount=Number(x.amount);if(!(amount>0)||!Number.isFinite(amount))throw Error('Payment must be greater than zero.');if(!x.date)throw Error('Choose a payment date.');if(!['cash','momo','bank','other'].includes(x.method))throw Error('Choose a valid payment method.');const charge=d.charges.find(c=>String(c.id)===String(p.charge||p.chargeId));if(!charge)throw Error('The water charge linked to this payment could not be found. No changes were saved.');const otherPaid=sum(waterPaymentsFor(charge),q=>String(q.id)!==String(p.id)?Number(q.amount)||0:0),limit=Math.max(0,(Number(charge.final)||0)-otherPaid);if(amount>limit+0.001)throw Error('Payment cannot exceed the remaining water balance of '+money(limit)+'.');p.amount=Math.round(amount*100)/100;p.date=x.date;p.receipt=(x.receipt||'').trim();p.method=x.method});const del=$('#deleteWaterPayment');if(del)del.onclick=()=>{if(safeDeleteLinked('this water payment')){d.waterPayments=d.waterPayments.filter(x=>String(x.id)!==String(id));save();closeModal();render()}}}
function waterPaymentForm(id){let c=d.charges.find(x=>String(x.id)===String(id));if(!c){alert('Save this tenant\'s monthly charge first.');return}let paid=waterPaid(c),balance=(+c.final||0)-paid;if(balance<=0){alert('This water charge is already fully paid.');return}showModal('Record water payment','<div class="card"><b>'+esc(tn(c.tenant))+' — '+esc(rn(c.tenancy&&d.tenancies.find(t=>String(t.id)===String(c.tenancy))?.room))+'</b><p class="muted">Month: '+esc((d.bills.find(b=>String(b.id)===String(c.bill))||{}).month||'')+' · Charge '+money(c.final)+' · Paid '+money(paid)+' · Balance '+money(balance)+'</p></div><form><div class="field full"><label>Quick amount</label><div class="actions" style="display:flex;gap:8px"><button type="button" class="secondary" id="waterPayHalf">Half balance</button><button type="button" class="secondary" id="waterPayFull">Full balance</button></div></div><div class="formgrid"><div class="field"><label>Payment amount (GH₵) *</label><input name="amount" id="waterPayAmount" type="number" min="0.01" max="'+Math.max(0,balance).toFixed(2)+'" step=".01" required></div><div class="field"><label>Payment date *</label><input name="date" type="date" value="'+today()+'" required></div><div class="field full"><label>Receipt / reference (optional)</label><input name="receipt" placeholder="Optional reference"></div><div class="field full"><label>Payment method *</label><select name="method" required><option value="cash">Cash</option><option value="momo">Mobile Money (MoMo)</option><option value="bank">Bank transfer</option><option value="other">Other</option></select></div></div>'+errHtml()+'<div class="actions"><button class="primary">Save water payment</button></div></form>',x=>{let amount=+x.amount;if(!(amount>0))throw Error('Enter a payment greater than zero.');if(amount>balance+0.001)throw Error('Payment is greater than the outstanding balance.');d.waterPayments.push({id:next(d.waterPayments),charge:c.id,chargeId:c.id,amount,date:x.date,receipt:(x.receipt||"").trim(),method:x.method})});const amountInput=$('#waterPayAmount'),halfButton=$('#waterPayHalf'),fullButton=$('#waterPayFull');if(halfButton)halfButton.onclick=()=>{amountInput.value=(Math.round(balance*50)/100).toFixed(2)};if(fullButton)fullButton.onclick=()=>{amountInput.value=balance.toFixed(2)}}
function waterReport(id){
 let b=d.bills.find(x=>String(x.id)===String(id));if(!b)return;
 let charges=d.charges.filter(c=>String(c.bill)===String(id));
 let rows=charges.map(c=>{let paid=waterPaid(c),due=+c.final||0,bal=Math.max(0,due-paid),status=c.attendance==='away'?'🚫 AWAY — NO CHARGE':bal<=0?'✅ PAID':paid>0?'🟡 PARTIAL':'❌ UNPAID',ten=d.tenancies.find(t=>String(t.id)===String(c.tenancy)),room=ten&&d.rooms.find(r=>String(r.id)===String(ten.room)),points=c.attendance==='away'?0:(+c.points||0);return{c,paid,due,bal,status,ten,room,points}});
 const due=sum(rows,x=>x.due),paid=sum(rows,x=>x.paid),bal=sum(rows,x=>x.bal),totalPoints=sum(rows,x=>x.points);
 const blockOf=r=>{const s=String(r&&((r.category||r.type)||'')).toLowerCase();return s.includes('single')?'🏠 Single Room Block':(s.includes('chamber')||s.includes('hall'))?'🏠 Chamber & Hall Block':'🏠 Other Rooms'};
 const blockOrder=['🏠 Single Room Block','🏠 Chamber & Hall Block','🏠 Other Rooms'];
 const allocatedDifference=Math.round((due-(Number(b.actual)||0))*100)/100;let text=(localStorage.getItem('hp-house-name')||'').trim()?('🏠 '+localStorage.getItem('hp-house-name').trim()+'\n\n'):'';text+='💧 WATER BILL — '+b.month+'\nActual water bill: '+money(b.actual)+'\nRate per point (rounded up): '+money(b.rate)+'\nAllocation difference (charges − actual bill): '+money(allocatedDifference)+'\n'+(Number(b.total)>0?'Total points used for rate: '+Number(b.total):'⚠ ZERO POINTS: review points before allocating charges')+'\n\n';
 for(const block of blockOrder){const group=rows.filter(x=>blockOf(x.room)===block);if(!group.length)continue;const blockPoints=sum(group,x=>x.points);text+=block+'\nTotal points: '+blockPoints+'\n';text+=group.map(x=>{const r=x.room;const roomName=r?(r.number+' ('+r.type+')'):'Room unavailable';return (x.c.attendance==='away'?'🚫 ':'👤 ')+(x.c.billName||tn(x.c.tenant))+'\n   Room: '+roomName+'\n   '+(x.c.attendance==='away'?'Attendance: AWAY — no water charge this month':'Points: '+x.points+'   |   Charge: '+money(x.due))+'\n   Paid: '+money(x.paid)+'   |   Balance: '+money(x.bal)+'\n   Status: '+x.status}).join('\n\n')+'\n\n'}
 text+='━━━━━━━━━━━━━━━━\nTOTAL POINTS CHARGED: '+totalPoints+'\nTOTAL CHARGES: '+money(due)+'\nTOTAL COLLECTED: '+money(paid)+'\nTOTAL OUTSTANDING: '+money(bal)+'\nACTUAL WATER BILL: '+money(b.actual)+'\nALLOCATION DIFFERENCE: '+money(allocatedDifference)+'\n'+(allocatedDifference>0?'Allocated charges exceed the actual bill by '+money(allocatedDifference)+'.':allocatedDifference<0?'Allocated charges are below the actual bill by '+money(Math.abs(allocatedDifference))+'.':'Allocated charges match the actual bill.')+'\n━━━━━━━━━━━━━━━━\nPlease pay any outstanding balance as soon as possible.';
 showModal('WhatsApp water-bill list — '+b.month,'<p class="muted">Copy this ready-formatted list and paste it into WhatsApp. Groups are based on the general room category; room descriptions remain visible.</p><textarea id="waterReportText" rows="18" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:14px system-ui"></textarea><div class="actions"><button class="primary" id="copyWaterReport">Copy WhatsApp list</button><button class="secondary" id="selectWaterReport">Select text</button></div><p class="muted">Only saved charges for this month are included. Record or correct payments before generating the final list.</p>',()=>{});
 $('#waterReportText').value=text;
 $('#copyWaterReport').onclick=async()=>{let ta=$('#waterReportText');try{await navigator.clipboard.writeText(ta.value);alert('Water-bill list copied. Open WhatsApp and paste it into your group.')}catch(e){ta.focus();ta.select();try{document.execCommand('copy');alert('Water-bill list copied. Open WhatsApp and paste it into your group.')}catch(_){alert('Please select the text and copy it manually.')}}};
 $('#selectWaterReport').onclick=()=>{$('#waterReportText').focus();$('#waterReportText').select()};
}
try{load();if(sessionStorage.getItem('hp-open')==='1')shell();else login()}
catch(error){const app=$('#app');if(app){app.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f6f4;color:#182923;font:15px system-ui"><div style="max-width:520px;background:white;border:1px solid #dce5df;border-radius:16px;padding:22px"><h2 style="margin:0 0 10px">HousePilot could not finish loading</h2><p style="line-height:1.5">Your saved property records have not been intentionally reset. Please take a screenshot of this message and contact support before clearing browser data or trying a reset.</p><p id="hpStartupError" style="font-size:12px;color:#66756d;overflow-wrap:anywhere"></p><button type="button" onclick="location.reload()" style="margin-top:8px;background:#176b4b;color:white">Try again</button></div></div>';const detail=$('#hpStartupError');if(detail)detail.textContent=error&&error.message?error.message:'An unexpected startup error occurred.'}}
})();
