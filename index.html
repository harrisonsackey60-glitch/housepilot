;width:100%;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.empty{text-align:center;padding:22px;color:var(--muted)}.pill{background:#e4f2ea;color:var(--g);border-radius:20px;padding:3px 8px;font-size:11px}.away{background:#f6ead9;color:#875e13}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;align-items:flex-end;justify-content:center;padding:10px}.modal.show{display:flex}.modalbox{background:white;border-radius:16px;padding:17px;width:min(650px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.login{min-height:100vh;background:#142a24;display:grid;place-items:center;padding:18px}.loginbox{background:white;border-radius:18px;padding:25px;width:min(390px,100%)}.loginbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:8px 0 12px}.loginbox button{width:100%}.status{font-size:13px;color:#a33434;margin-top:10px}@keyframes hp-track-fill{from{width:0}to{width:var(--hp-progress)}}.hp-track-fill{height:10px;border-radius:999px;background:#21865a;width:0;animation:hp-track-fill 1.1s ease-out forwards}.hp-track-bg{height:10px;border-radius:999px;background:#e5ece7;overflow:hidden}.tenant-name-link{padding:0;background:transparent;color:var(--g);border-radius:0;text-align:left;font-weight:800;text-decoration:underline;text-underline-offset:3px}.tabs{position:fixed;z-index:30;left:50%;right:auto;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:560px;display:flex;align-items:center;justify-content:space-between;gap:3px;overflow:hidden;margin:0;padding:7px 8px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:28px;box-shadow:0 6px 24px #142a2424;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}.tabs .tab{flex:1 1 0;min-width:0;white-space:normal;overflow-wrap:anywhere;padding:9px 3px;font-size:11px;line-height:1.15;text-align:center;border:0;border-radius:20px;background:transparent;color:var(--muted)}.tabs .tab.active{background:var(--g);color:#fff}.wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom))}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.two,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:12px;padding-bottom:calc(100px + env(safe-area-inset-bottom))}.tabs{gap:2px;padding:6px 6px}.tabs .tab{padding:9px 2px;font-size:10px}}
</style></head><body><div id="app"><div style="padding:30px">Loading HousePilot…</div></div><div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="mt"></h2><button onclick="closeModal()">Close</button></div><div id="mb"></div></div></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),today=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')},money=n=>new Intl.NumberFormat('en-GH',{style:'currency',currency:'GHS'}).format(Number(n||0)),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empty=()=>({roomTypes:[],rooms:[],tenants:[],tenancies:[],periods:[],rentPayments:[],bills:[],charges:[],waterPayments:[]});
let d,section='Dashboard';
function roomPriceAt(room,asOf=today()){if(!room)return 0;const history=Array.isArray(room.priceHistory)?room.priceHistory:[];const eligible=history.filter(h=>!h.date||String(h.date)<=asOf).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));return eligible.length?Math.max(0,Number(eligible[eligible.length-1].price)||0):Math.max(0,Number(room.price)||0)}
 function load(){if(localStorage.getItem('hp-fresh-start-v2')!=='done'){localStorage.setItem('hp-data',JSON.stringify(empty()));localStorage.setItem('hp-fresh-start-v2','done')}try{d=JSON.parse(localStorage.getItem('hp-data')||'null')||empty()}catch(e){d=empty()} d.roomTypes=d.roomTypes||[]; d.rooms=d.rooms||[]; d.tenants=d.tenants||[]; d.tenancies=d.tenancies||[]; d.tenancies.forEach(t=>{if(t.points==null)t.points=1}); d.periods=d.periods||[]; d.rentPayments=d.rentPayments||[]; d.bills=d.bills||[]; d.charges=d.charges||[]; d.waterPayments=d.waterPayments||[]; d.rooms.forEach(r=>{if(!d.roomTypes.some(t=>t.name.toLowerCase()===String(r.type||'').toLowerCase()))d.roomTypes.push({id:next(d.roomTypes),name:r.type||'Single Room',price:+r.price||0});if(Array.isArray(r.priceHistory)&&r.priceHistory.length)r.price=roomPriceAt(r,today())})}
function save(){try{localStorage.setItem('hp-data',JSON.stringify(d))}catch(e){if(e&&(/quota|storage/i.test(String(e.name||'')+' '+String(e.message||''))))throw Error('HousePilot could not save because this browser may be running out of local storage. Your existing saved records have not been intentionally cleared. Close the form and avoid refreshing until you have freed browser storage or reduced the size of new photos.');throw e}}
function login(){
 function showLogin(recovery=false){
  if(recovery){
   $('#app').innerHTML='<div class="login"><div class="loginbox"><div class="brand">HousePilot<small>PROPERTY RECORDS</small></div><h1 style="margin-top:22px">Recover passcode</h1><p class="muted">Enter your recovery code, then choose a new passcode.</p><form id="rf"><input id="recoveryCode" required placeholder="Recovery code" autocomplete="off"><input id="newPass" type="password" required minlength="4" placeholder="New passcode" inputmode="numeric"><input id="newPass2" type="password" required minlength="4" placeholder="Confirm new passcode" inputmode="numeric"><button class="primary">Reset passcode</button></form><button class="secondary" style="width:100%;margin-top:10px" id="backLogin">Back to login</button><div id="err" class="status"></div></div></div>';
   $('#backLogin').onclick=()=>showLogin(false);
   $('#rf').onsubmit=e=>{e.preventDefault();const code=$('#recoveryCode').value.trim(),stored=localStorage.getItem('hp-recovery'),p=$('#newPass').value;if(!stored||code!==stored){$('#err').textContent='The recovery code is incorrect. Your records have not been changed.';return}if(p!==$('#newPass2').value){$('#err').textContent='The new passcodes do not match.';return}localStorage.setItem('hp-pass',p);showLogin(false);};
   return;
  }
  const first=!localStorage.getItem('hp-pass');
  $('#app').innerHTML='<div class="login"><div class="loginbox"><div class="brand">HousePilot<small>PROPERTY RECORDS</small></div><h1 style="margin-top:22px">'+(first?'Create your passcode':'Welcome back')+'</h1><p class="muted">'+(first?'Choose a passcode and a recovery code. Keep the recovery code somewhere safe.':'Enter your passcode to open HousePilot.')+'</p><form id="lf"><input id="pw" type="password" required minlength="4" placeholder="'+(first?'Create passcode':'Passcode')+'" inputmode="numeric" autocomplete="'+(first?'new-password':'current-password')+'">'+(first?'<input id="pw2" type="password" required minlength="4" placeholder="Confirm passcode" inputmode="numeric" autocomplete="new-password"><input id="recoverySetup" required minlength="6" placeholder="Create recovery code (at least 6 characters)" autocomplete="off"><input id="recoverySetup2" required minlength="6" placeholder="Confirm recovery code" autocomplete="off"><p class="muted">Write down your recovery code. You need it if you forget your passcode.</p>':'')+'<button class="primary">'+(first?'Create passcode and unlock':'Unlock HousePilot')+'</button></form>'+(first?'':'<button class="secondary" style="width:100%;margin-top:10px" id="forgotPass">Forgot passcode?</button>')+'<p class="muted">Local mode: records and recovery details are saved in this browser on this device only. Recovery will not work if browser site data is erased or you switch devices.</p><div id="err" class="status"></div></div></div>';
  if(!first)$('#forgotPass').onclick=()=>showLogin(true);
  $('#lf').onsubmit=e=>{e.preventDefault();const p=$('#pw').value;if(first){const code=$('#recoverySetup').value.trim();if(p!==$('#pw2').value){$('#err').textContent='The passcodes do not match.';return}if(code.length<6||code!==$('#recoverySetup2').value.trim()){$('#err').textContent='The recovery codes must match and contain at least 6 characters.';return}localStorage.setItem('hp-pass',p);localStorage.setItem('hp-recovery',code);alert('Passcode created. Keep your recovery code safe: '+code)}else if(p!==localStorage.getItem('hp-pass')){$('#err').textContent='Incorrect passcode. Try again.';return}sessionStorage.setItem('hp-open','1');load();shell()};
 }
 showLogin(false);
}
function shell(){ $('#app').innerHTML='<header><div class="brand"><span id="houseBrand">'+esc(localStorage.getItem('hp-house-name')||'HousePilot')+'</span><small>PROPERTY RECORDS</small></div><div style="display:flex;gap:8px;align-items:center"><button class="secondary" id="profileButton" type="button">Profile</button><button onclick="logout()">Lock</button></div></header><main class="wrap"><div class="notice">LOCAL MODE — records are saved only in this browser on this device. Online syncing and server-side passcode security are not connected. Keep this limitation in mind when entering records.</div><div id="content"></div><div class="tabs" aria-label="Main navigation">'+['Dashboard','Rooms','Tenants','Ended Tenants','Rent Tracking','Water Bill'].map(x=>'<button class="tab '+(x===section?'active':'')+'" data-section="'+x+'">'+x+'</button>').join('')+'</div></main>';
 const pb=$('#profileButton');if(pb)pb.onclick=()=>profileForm();document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});render();}
window.logout=()=>{sessionStorage.removeItem('hp-open');login()};window.closeModal=()=>$('#modal').classList.remove('show');
function profileForm(){const current=localStorage.getItem('hp-house-name')||'';showModal('House profile','<p class="muted">Set the name of your property here. After you save and close this profile, the name will remain at the top of HousePilot and appear on water-bill lists.</p><form><div class="field"><label>House / property name *</label><input name="houseName" maxlength="100" value="'+esc(current)+'" placeholder="e.g. Sackey Family House" required></div>'+errHtml()+'<div class="actions"><button class="primary">Save profile</button></div></form>',x=>{const name=(x.houseName||'').trim();if(!name)throw Error('Enter a house name.');localStorage.setItem('hp-house-name',name);const brand=$('#houseBrand');if(brand)brand.textContent=name;});}
function active(){return d.tenancies.filter(t=>t.status==='active')}function expiryInfo(t){if(!t||!t.end)return null;const n=new Date(),key=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'),a=Date.parse(key+'T00:00:00Z'),b=Date.parse(t.end+'T00:00:00Z');if(!Number.isFinite(b))return null;const days=Math.round((b-a)/86400000);if(days<0)return{days,kind:'expired'};if(days===0)return{days,kind:'today'};if(days<=30)return{days,kind:'soon'};return{days,kind:'active'}}function expiryBadge(t){const e=expiryInfo(t);if(!e)return '';if(e.kind==='expired')return '<span class="pill away">Expired · '+Math.abs(e.days)+'d ago</span>';if(e.kind==='today')return '<span class="pill away">Expires today</span>';if(e.kind==='soon')return '<span class="pill away">'+e.days+' days left</span>';return ''}function expiryPanel(){const items=active().map(t=>({t,e:expiryInfo(t)})).filter(x=>x.e&&['expired','today','soon'].includes(x.e.kind)).sort((a,b)=>a.e.days-b.e.days);return '<div class="card" style="margin-top:12px"><h2>Rent expiry alerts</h2><p class="muted">Warnings appear 30 days before the tenancy end date.</p>'+(items.length?items.map(x=>'<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>'+esc(tn(x.t.tenant))+'</b> · '+esc(rn(x.t.room))+'<div class="muted">End date: '+esc(dateDisplay(x.t.end))+' · '+(x.e.kind==='expired'?'Expired '+Math.abs(x.e.days)+' day(s) ago':x.e.kind==='today'?'Expires today':x.e.days+' day(s) remaining')+'</div>'+expiryBadge(x.t)+'</div>').join(''):'<div class="empty">No tenants expiring within the next 30 days.</div>')+'</div>'}function tn(id){return (d.tenants.find(t=>String(t.id)===String(id))||{}).name||'—'}function rn(id){return (d.rooms.find(r=>String(r.id)===String(id))||{}).number||'—'}function next(a){return a.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1}
function roomGroup(name){const s=String(name||'').toLowerCase().replace(/\s+/g,' ').trim();if(/\bsingle\b/.test(s))return 'single';if(s.includes('chamber')||s.includes('hall'))return 'chamber';return 'other:'+s}
function roomDescription(name){return /no washroom/i.test(String(name||''))?'With No Washroom':/washroom/i.test(String(name||''))?'With Washroom':''}
function roomBase(name){return String(name||'').replace(/\s*(with no washroom|without washroom|with washroom|no washroom)\s*/ig,' ').replace(/\s+/g,' ').trim()}
function datePlusYears(date,years){if(!date)return '';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date);if(!m)return '';const y=+m[1],mo=+m[2]-1,day=+m[3],targetYear=y+(+years||0);const last=new Date(Date.UTC(targetYear,mo+1,0)).getUTCDate();return targetYear+'-'+String(mo+1).padStart(2,'0')+'-'+String(Math.min(day,last)).padStart(2,'0')}
function dateDisplay(date){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(date||''));return m?m[3]+'/'+m[2]+'/'+m[1]:(date||'—')}
function safeDeleteLinked(label){return confirm('Delete '+label+'? Linked history and totals may change. This action cannot be undone.')}function sum(a,f){return a.reduce((n,x)=>n+f(x),0)}function metric(k,v){return '<div class="card"><div class="muted">'+k+'</div><div class="metric">'+v+'</div></div>'}
let roomFilter='All';

 function globalSearchResults(query){const q=String(query||'').trim().toLowerCase();if(!q)return '';const out=[];const has=v=>String(v==null?'':v).toLowerCase().includes(q);d.tenants.forEach(t=>{const ts=d.tenancies.filter(x=>String(x.tenant)===String(t.id));if([t.name,t.phone,t.phone2,t.code,t.id].some(has)||ts.some(x=>[x.code,x.id,rn(x.room),x.start,x.end].some(has)))out.push({kind:'Tenant',label:t.name||'Unnamed tenant',detail:(t.code||'Tenant ID '+t.id)+' · '+(ts.some(x=>x.status==='active')?'Active':'Ended / history'),section:ts.some(x=>x.status==='active')?'Tenants':'Ended Tenants',action:'tenant',id:t.id});});d.rooms.forEach(r=>{const occ=active().some(t=>String(t.room)===String(r.id));if([r.number,r.type,r.description,r.id,r.price].some(has))out.push({kind:r.active===false?'Inactive room':'Room',label:r.number||('Room '+r.id),detail:(r.type||'')+' · '+(occ?'Occupied':'Vacant'),section:'Rooms',action:'room',id:r.id})});d.roomTypes.forEach(t=>{if([t.name,t.description,t.id].some(has))out.push({kind:t.active===false?'Inactive category':'Room category',label:t.name||('Category '+t.id),detail:t.description||'Category',section:'Rooms',action:'category',id:t.id})});d.periods.forEach(p=>{const t=d.tenancies.find(x=>String(x.id)===String(p.tenancy)),label=tn(t&&t.tenant),paid=sum(d.rentPayments,x=>String(x.period)===String(p.id)?Number(x.amount)||0:0),status=paid>=(Number(p.amount)||0)?'Paid':paid?'Partial':'Unpaid';if([label,t&&t.code,t&&t.id,p.start,p.end,p.amount,status,p.id].some(has))out.push({kind:'Rent period',label:label+' · '+dateDisplay(p.start)+' – '+dateDisplay(p.end),detail:status+' · Balance '+money(Math.max(0,(Number(p.amount)||0)-paid)),section:'Rent Tracking',action:'rent',id:p.id})});d.bills.forEach(b=>{const cs=d.charges.filter(c=>String(c.bill)===String(b.id)),text=cs.map(c=>tn(c.tenant)+' '+rn((d.tenancies.find(t=>String(t.id)===String(c.tenancy))||{}).room)).join(' ');if([b.month,b.actual,b.id,text].some(has))out.push({kind:'Water bill',label:b.month,detail:'Actual '+money(b.actual)+' · '+cs.length+' tenant charges',section:'Water Bill',action:'water',id:b.id})});return out.length?out.slice(0,40).map(x=>'<button type="button" class="secondary" style="display:block;width:100%;text-align:left;margin:7px 0" data-global-open="'+x.action+'" data-record-id="'+esc(x.id)+'" data-record-section="'+esc(x.section)+'"><b>'+esc(x.label)+'</b><div class="muted">'+esc(x.kind)+' · '+esc(x.detail)+' · Open '+esc(x.section)+'</div></button>').join(''):'<div class="empty">No matching records found.</div>'}
 function openGlobalRecord(action,id,targetSection){section=targetSection;render();if(action==='tenant')tenantDetails(id);else if(action==='room')editRoomForm(id);else if(action==='category')editTypeForm(id);else if(action==='rent')rentPay(id);else if(action==='water')waterReport(id)}
 function wireGlobalSearch(){const input=$('#globalSearch'),results=$('#globalSearchResults');if(!input||!results)return;input.oninput=()=>{results.innerHTML=globalSearchResults(input.value);results.querySelectorAll('[data-global-open]').forEach(b=>b.onclick=()=>openGlobalRecord(b.dataset.globalOpen,b.dataset.recordId,b.dataset.recordSection))}}
 function wireSectionSearch(){const input=$('#sectionSearch');if(!input)return;input.oninput=()=>{const q=input.value.trim().toLowerCase();$('#content').querySelectorAll('tr').forEach(row=>{if(row.querySelector('th'))return;row.style.display=!q||row.textContent.toLowerCase().includes(q)?'':'none'});if(section==='Water Bill')$('#content').querySelectorAll('div[style*="border-bottom"]').forEach(card=>{card.style.display=!q||card.textContent.toLowerCase().includes(q)?'':'none'})}}
function render(){const c=$('#content');if(!c)return;
if(section==='Dashboard'){
 const monthKey=window.hpDashboardMonth||(window.hpDashboardMonth=today().slice(0,7));
 const monthStart=monthKey+'-01',monthEnd=monthKey+'-'+new Date(Number(monthKey.slice(0,4)),Number(monthKey.slice(5,7)),0).getDate();
 const activeTenancies=active(),activeRooms=d.rooms.filter(r=>r.active!==false),occupied=new Set(activeTenancies.map(t=>String(t.room)));
 const totalRentDue=sum(d.periods,p=>Number(p.amount)||0),totalRentPaid=sum(d.rentPayments,p=>Number(p.amount)||0),rentBalance=Math.max(0,totalRentDue-totalRentPaid);
 const totalWaterDue=sum(d.charges,c=>Number(c.final)||0),totalWaterPaid=sum(d.waterPayments,p=>Number(p.amount)||0),waterBalance=Math.max(0,totalWaterDue-totalWaterPaid);
 const monthlyTenancies=activeTenancies.filter(t=>(!t.start||t.start<=monthEnd)&&(!t.end||t.end>=monthStart)&&t.arrangement!=='family');
 const expectedMonthRent=sum(monthlyTenancies,t=>Number(t.monthly)||0);
 const monthRentPayments=sum(d.rentPayments,p=>String(p.date||'').slice(0,7)===monthKey?Number(p.amount)||0:0);
 const monthBills=d.bills.filter(b=>b.month===monthKey),monthCharges=d.charges.filter(c=>monthBills.some(b=>String(b.id)===String(c.bill)));

function chargeForm(n){let b=d.bills.find(x=>String(x.id)===String(n)),ts=active();if(!b)return;if(!ts.length){alert('Register an active tenant first.');return}if(d.charges.some(c=>String(c.bill)===String(n)&&waterPaid(c)>0)){alert('This month has recorded water payments. Its saved charges and points are locked to protect historical records.');return}showModal('Manage monthly water charges','<p class="muted">Enter each household’s points for this month first. HousePilot recalculates the rate from these monthly points, rounding up to the next whole cedi. Away means zero points/charge for this month. Saved months stay separate.</p><form>'+ts.map(t=>{let old=d.charges.find(c=>String(c.bill)===String(n)&&String(c.tenancy)===String(t.id));return '<div class="card" style="margin:9px 0"><b>'+esc(tn(t.tenant))+' — '+esc(rn(t.room))+'</b><div class="formgrid" style="margin-top:9px"><div class="field"><label>Attendance</label><select name="a'+t.id+'"><option value="present" '+(old?.attendance!=='away'?'selected':'')+'>Present</option><option value="away" '+(old?.attendance==='away'?'selected':'')+'>Away</option></select></div><div class="field"><label>Points</label><input name="p'+t.id+'" type="number" min="0" step=".01" value="'+(old?.points??t.points)+'"></div><div class="field"><label>Adjustment (+/-)</label><input name="x'+t.id+'" type="number" step=".01" value="'+(old?.adjustment??0)+'"></div><div class="field"><label>Final charge override</label><input name="f'+t.id+'" type="number" min="0" step=".01" value="'+(old?.override??'')+'" placeholder="Auto"></div></div><div class="muted">Household point guide: adult = 1 point; each complete pair of children under 12 = 1 point; each child aged 12+ = 1 point. Enter the calculated points for this month.</div></div>'}).join('')+errHtml()+'<div class="actions"><button class="primary">Save charges</button></div></form>',x=>{const rows=ts.map(t=>{let attendance=x['a'+t.id],rawPoints=Number(x['p'+t.id]),points=attendance==='away'?0:rawPoints,adjustment=Number(x['x'+t.id]||0),override=x['f'+t.id];if(!Number.isFinite(rawPoints)||rawPoints<0)throw Error('Points must be zero or greater for '+tn(t.tenant)+'.');if(!Number.isFinite(adjustment))throw Error('Enter a valid adjustment for '+tn(t.tenant)+'.');if(override!==''&&(!Number.isFinite(Number(override))||Number(override)<0))throw Error('Charge override must be zero or greater for '+tn(t.tenant)+'.');return {t,attendance,points,adjustment,override}});const total=rows.reduce((v,r)=>v+r.points,0);if(!(total>0))throw Error('Total monthly points are zero. Enter points for at least one household before calculating charges.');const rate=Math.ceil((Number(b.actual)||0)/total);b.total=total;b.rate=rate;b.zeroPoints=false;b.ratePendingReview=false;for(const r of rows){const {t,attendance,points,adjustment,override}=r,calc=points*rate,final=override!==''?Number(override):Math.max(0,calc+adjustment),old=d.charges.find(c=>String(c.bill)===String(n)&&String(c.tenancy)===String(t.id)),o={id:old?old.id:next(d.charges),bill:+n,tenancy:t.id,tenant:t.tenant,attendance,points,calc,adjustment,override,final};if(old)Object.assign(old,o);else d.charges.push(o)}})}
function waterPaymentsFor(charge){return d.waterPayments.filter(p=>String(p.charge)===String(charge.id)||String(p.chargeId)===String(charge.id))}
function waterPaid(charge){return sum(waterPaymentsFor(charge),p=>+p.amount||0)}
function editWaterPayment(id){let p=d.waterPayments.find(x=>String(x.id)===String(id));if(!p)return;showModal('Edit water payment','<form><div class="formgrid"><div class="field"><label>Amount (GH₵) *</label><input name="amount" type="number" min=".01" step=".01" value="'+p.amount+'" required></div><div class="field"><label>Payment date *</label><input name="date" type="date" value="'+esc(p.date||today())+'" required></div><div class="field full"><label>Receipt / reference (optional)</label><input name="receipt" value="'+esc(p.receipt||'')+'"></div><div class="field full"><label>Payment method *</label><select name="method" required><option value="cash" '+(p.method==='cash'?'selected':'')+'>Cash</option><option value="momo" '+(p.method==='momo'?'selected':'')+'>Mobile Money (MoMo)</option><option value="bank" '+(p.method==='bank'?'selected':'')+'>Bank transfer</option><option value="other" '+(p.method==='other'?'selected':'')+'>Other</option></select></div></div>'+errHtml()+'<div class="actions"><button class="primary">Save changes</button><button type="button" class="secondary" id="deleteWaterPayment">Delete payment</button></div></form>',x=>{const amount=Number(x.amount);if(!(amount>0)||!Number.isFinite(amount))throw Error('Payment must be greater than zero.');if(!x.date)throw Error('Choose a payment date.');if(!['cash','momo','bank','other'].includes(x.method))throw Error('Choose a valid payment method.');const charge=d.charges.find(c=>String(c.id)===String(p.charge||p.chargeId));if(!charge)throw Error('The water charge linked to this payment could not be found. No changes were saved.');const otherPaid=sum(waterPaymentsFor(charge),q=>String(q.id)!==String(p.id)?Number(q.amount)||0:0),limit=Math.max(0,(Number(charge.final)||0)-otherPaid);if(amount>limit+0.001)throw Error('Payment cannot exceed the remaining water balance of '+money(limit)+'.');p.amount=Math.round(amount*100)/100;p.date=x.date;p.receipt=(x.receipt||'').trim();p.method=x.method});const del=$('#deleteWaterPayment');if(del)del.onclick=()=>{if(safeDeleteLinked('this water payment')){d.waterPayments=d.waterPayments.filter(x=>String(x.id)!==String(id));save();closeModal();render()}}}
function waterPaymentForm(id){let c=d.charges.find(x=>String(x.id)===String(id));if(!c){alert('Save this tenant\'s monthly charge first.');return}let paid=waterPaid(c),balance=(+c.final||0)-paid;if(balance<=0){alert('This water charge is already fully paid.');return}showModal('Record water payment','<div class="card"><b>'+esc(tn(c.tenant))+' — '+esc(rn(c.tenancy&&d.tenancies.find(t=>String(t.id)===String(c.tenancy))?.room))+'</b><p class="muted">Month: '+esc((d.bills.find(b=>String(b.id)===String(c.bill))||{}).month||'')+' · Charge '+money(c.final)+' · Paid '+money(paid)+' · Balance '+money(balance)+'</p></div><form><div class="formgrid"><div class="field"><label>Payment amount (GH₵) *</label><input name="amount" type="number" min="0.01" max="'+Math.max(0,balance).toFixed(2)+'" step=".01" required></div><div class="field"><label>Payment date *</label><input name="date" type="date" value="'+today()+'" required></div><div class="field full"><label>Receipt / reference (optional)</label><input name="receipt" placeholder="Optional reference"></div><div class="field full"><label>Payment method *</label><select name="method" required><option value="cash">Cash</option><option value="momo">Mobile Money (MoMo)</option><option value="bank">Bank transfer</option><option value="other">Other</option></select></div></div>'+errHtml()+'<div class="actions"><button class="primary">Save water payment</button></div></form>',x=>{let amount=+x.amount;if(!(amount>0))throw Error('Enter a payment greater than zero.');if(amount>balance+0.001)throw Error('Payment is greater than the outstanding balance.');d.waterPayments.push({id:next(d.waterPayments),charge:c.id,chargeId:c.id,amount,date:x.date,receipt:(x.receipt||"").trim(),method:x.method})})}
function waterReport(id){
 let b=d.bills.find(x=>String(x.id)===String(id));if(!b)return;
 let charges=d.charges.filter(c=>String(c.bill)===String(id));
 let rows=charges.map(c=>{let paid=waterPaid(c),due=+c.final||0,bal=Math.max(0,due-paid),status=bal<=0?'✅ PAID':paid>0?'🟡 PARTIAL':'❌ UNPAID',ten=d.tenancies.find(t=>String(t.id)===String(c.tenancy)),room=ten&&d.rooms.find(r=>String(r.id)===String(ten.room)),points=c.attendance==='away'?0:(+c.points||0);return{c,paid,due,bal,status,ten,room,points}});
 const due=sum(rows,x=>x.due),paid=sum(rows,x=>x.paid),bal=sum(rows,x=>x.bal),totalPoints=sum(rows,x=>x.points);
 const blockOf=r=>{const s=String(r&&((r.category||r.type)||'')).toLowerCase();return s.includes('single')?'🏠 Single Room Block':(s.includes('chamber')||s.includes('hall'))?'🏠 Chamber & Hall Block':'🏠 Other Rooms'};
 const blockOrder=['🏠 Single Room Block','🏠 Chamber & Hall Block','🏠 Other Rooms'];
 const allocatedDifference=Math.round((due-(Number(b.actual)||0))*100)/100;let text=(localStorage.getItem('hp-house-name')||'').trim()?('🏠 '+localStorage.getItem('hp-house-name').trim()+'\n\n'):'';text+='💧 WATER BILL — '+b.month+'\nActual water bill: '+money(b.actual)+'\nRate per point (rounded up): '+money(b.rate)+'\nAllocation difference (charges − actual bill): '+money(allocatedDifference)+'\n'+(Number(b.total)>0?'Total points used for rate: '+Number(b.total):'⚠ ZERO POINTS: review points before allocating charges')+'\n\n';
 for(const block of blockOrder){const group=rows.filter(x=>blockOf(x.room)===block);if(!group.length)continue;const blockPoints=sum(group,x=>x.points);text+=block+'\nTotal points: '+blockPoints+'\n';text+=group.map(x=>{const r=x.room;const roomName=r?(r.number+' ('+r.type+')'):'Room unavailable';return '• '+tn(x.c.tenant)+' — '+roomName+'\n  Points: '+x.points+' → Charge: '+money(x.due)+'\n  Paid: '+money(x.paid)+' · Balance: '+money(x.bal)+' · '+x.status}).join('\n')+'\n\n'}
 text+='━━━━━━━━━━━━━━━━\nTOTAL POINTS CHARGED: '+totalPoints+'\nTOTAL CHARGES: '+money(due)+'\nTOTAL COLLECTED: '+money(paid)+'\nTOTAL OUTSTANDING: '+money(bal)+'\nACTUAL WATER BILL: '+money(b.actual)+'\nALLOCATION DIFFERENCE: '+money(allocatedDifference)+'\n'+(allocatedDifference>0?'Allocated charges exceed the actual bill by '+money(allocatedDifference)+'.':allocatedDifference<0?'Allocated charges are below the actual bill by '+money(Math.abs(allocatedDifference))+'.':'Allocated charges match the actual bill.')+'\n━━━━━━━━━━━━━━━━\nPlease pay any outstanding balance as soon as possible.';
 showModal('WhatsApp water-bill list — '+b.month,'<p class="muted">Copy this ready-formatted list and paste it into WhatsApp. Groups are based on the general room category; room descriptions remain visible.</p><textarea id="waterReportText" rows="18" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:14px system-ui"></textarea><div class="actions"><button class="primary" id="copyWaterReport">Copy WhatsApp list</button><button class="secondary" id="selectWaterReport">Select text</button></div><p class="muted">Only saved charges for this month are included. Record or correct payments before generating the final list.</p>',()=>{});
 $('#waterReportText').value=text;
 $('#copyWaterReport').onclick=async()=>{let ta=$('#waterReportText');try{await navigator.clipboard.writeText(ta.value);alert('Water-bill list copied. Open WhatsApp and paste it into your group.')}catch(e){ta.focus();ta.select();try{document.execCommand('copy');alert('Water-bill list copied. Open WhatsApp and paste it into your group.')}catch(_){alert('Please select the text and copy it manually.')}}};
 $('#selectWaterReport').onclick=()=>{$('#waterReportText').focus();$('#waterReportText').select()};
}
load();if(sessionStorage.getItem('hp-open')==='1')shell();else login();
})();
